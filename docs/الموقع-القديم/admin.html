:root{
  /* ═══ هوية Clarity — نظيف وموثوق ═══
     الأسماء القديمة محفوظة عمداً (--orange, --navy...) حتى لا ينكسر
     أي نمط موجود، لكن قيمها الآن من لوحة Clarity. */
  --navy:#0D1424; --navy-2:#1E2A42; --navy-3:#070C16;
  --dark:#0D1424;
  --orange:#3D5AFE; --orange-d:#2E45D8; --orange-l:#6B7FFF;   /* الأساسي: أزرق */
  --yellow:#00B589; --yellow-d:#009B75;                        /* الثانوي: أخضر */
  --bg:#F6F7FB; --white:#FFFFFF; --line:#E6E9F0;
  --text:#0D1424; --muted:#5B6478; --muted-2:#98A0B0;
  --surf-2:#F0F2F7;
  --acc-soft:#EEF1FF; --acc2-soft:#E6F8F2;
  --green:#00B589; --green-l:#12C79A; --red:#EF4444;
  --r:16px;
  --grad-o:linear-gradient(135deg,#6B7FFF 0%,#3D5AFE 100%);
  --grad-o2:linear-gradient(135deg,#5470FF 0%,#2E45D8 100%);
  --grad-y:linear-gradient(135deg,#12C79A 0%,#00B589 100%);
  --grad-n:linear-gradient(160deg,#1E2A42 0%,#0D1424 100%);
  --shadow:0 1px 3px rgba(13,20,36,.05), 0 1px 2px rgba(13,20,36,.03);
  --shadow-h:0 8px 26px rgba(13,20,36,.10);
  --glow:0 4px 16px rgba(61,90,254,.28);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--white);border:1.5px solid var(--line);border-radius:12px;color:var(--text);padding:13px 15px;outline:none;width:100%;font-size:.95rem;min-height:48px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--orange)}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.container{max-width:1230px;margin:0 auto;padding:0 16px}

/* ===== الهيدر ===== */
.header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;box-shadow:0 1px 12px rgba(19,41,61,.05)}
.header .container{display:flex;align-items:center;gap:18px;padding:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:44px;height:44px;border-radius:12px;background:var(--white);border:1px solid var(--line);color:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.25rem}
.brand b{font-size:1.2rem;color:var(--orange);display:block;line-height:1.2}
.brand span{font-size:.8rem;color:var(--muted)}
.searchbar{flex:1;min-width:220px;display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.searchbar input{border:none;border-radius:0;background:transparent}
.searchbar button{background:var(--grad-o);color:#fff;padding:0 22px;font-weight:700;font-size:.91rem}
.searchbar button:hover{background:var(--orange-d)}
.h-actions{display:flex;align-items:center;gap:9px;margin-inline-start:auto}
.h-btn{width:46px;height:46px;border-radius:14px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;transition:.18s;flex-shrink:0}
.h-btn:hover{border-color:var(--orange);box-shadow:0 3px 12px rgba(255,107,0,.16)}
.h-btn svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.7}
.h-btn span:not(.badge){display:none}
.burger{width:46px;height:46px;border-radius:14px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.18s}
.burger:hover{border-color:var(--orange)}
.burger svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2}
.cart-rel{position:relative}
.badge{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--grad-o);color:#fff;font-size:.76rem;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--white)}

/* ===== السلايدر ===== */
.slider{position:relative;border-radius:12px;overflow:hidden;margin:16px auto;box-shadow:var(--shadow)}
.slide{display:none;min-height:180px;padding:26px 36px;color:#fff;position:relative;background:linear-gradient(105deg,var(--navy) 42%,var(--navy-2))}
.slide.on{display:flex;flex-direction:column;justify-content:center;animation:sfade .6s ease}
@keyframes sfade{from{opacity:.3}to{opacity:1}}
.slide .kicker{color:var(--orange);font-weight:700;font-size:.85rem;letter-spacing:.06em;margin-bottom:3px}
.slide h2{font-size:clamp(1.15rem,2.6vw,1.7rem);font-weight:800;line-height:1.4;max-width:30ch}
.slide p{color:#B9C7D4;margin:5px 0 14px;max-width:52ch;font-size:.9rem}
.slide .cta{display:inline-block;background:var(--orange);color:#fff;padding:8px 22px;border-radius:var(--r);font-weight:700;font-size:.88rem;width:fit-content}
.slide .cta:hover{background:var(--orange-d)}
.slide .art{position:absolute;inset-inline-start:auto;inset-inline-end:36px;top:50%;transform:translateY(-50%);font-size:4.2rem;opacity:.16}
.dots{position:absolute;bottom:12px;inset-inline-start:36px;display:flex;gap:7px}
.dots button{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots button.on{background:var(--orange);width:24px;border-radius:5px}

/* ===== الصفحات ===== */
.page{display:none;padding-bottom:40px}
.page.on{display:block}

/* ═══ admin.html — وضع الإدارة المستقل بالكامل ═══ */

body.admin-mode .container{padding-top:22px}

/* ═══ هيدر الإدارة — بهوية المتجر (أبيض + برتقالي) ═══ */
.adm-topbar{display:flex;align-items:center;gap:11px;background:var(--white);padding:13px 16px;position:sticky;top:0;z-index:60;box-shadow:0 1px 12px rgba(19,41,61,.06);border-bottom:1px solid var(--line)}
.adm-burger{width:40px;height:40px;border-radius:12px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.adm-burger:hover{border-color:var(--orange)}
.adm-burger svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2}
.adm-topbar .mk{width:36px;height:36px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.adm-topbar .mk img{width:100%;height:100%;object-fit:cover}
.adm-topbar .tx{flex:1;min-width:0}
.adm-topbar .tx b{display:block;color:var(--orange);font-size:.95rem;font-weight:800;line-height:1.3}
.adm-topbar .tx span{display:block;color:var(--muted);font-size:.8rem}

/* ═══ القائمة الجانبية للإدارة ═══ */
.adm-drawer-ov{position:fixed;inset:0;background:rgba(19,41,61,.5);opacity:0;pointer-events:none;transition:.25s;z-index:96}
.adm-drawer-ov.on{opacity:1;pointer-events:auto}
.adm-drawer{position:fixed;top:0;inset-inline-start:0;height:100vh;height:100dvh;width:min(300px,84vw);background:var(--white);z-index:97;transform:translateX(-102%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.18)}
[dir="rtl"] .adm-drawer{transform:translateX(102%)}
.adm-drawer.on{transform:translateX(0)}
.adm-drawer-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--grad-o)}
.adm-drawer-head .mk{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.adm-drawer-head .mk img{width:100%;height:100%;object-fit:cover}
.adm-drawer-head b{flex:1;color:#fff;font-size:.95rem;font-weight:800}
.adm-drawer-head button{color:#fff;font-size:1.1rem;opacity:.9;padding:4px 8px}
.adm-drawer-body{flex:1;overflow-y:auto;padding:12px}
.adm-link{display:flex;align-items:center;gap:11px;width:100%;padding:11px 10px;border-radius:11px;font-size:.92rem;font-weight:700;color:var(--text);text-align:start;transition:.15s}
.adm-link svg{width:19px;height:19px;stroke:var(--muted);fill:none;flex-shrink:0}
.adm-link:hover{background:var(--bg)}
.adm-link.active{background:#EEF1FF;color:var(--orange-d)}
.adm-link.active svg{stroke:var(--orange-d)}
.adm-link.status-tab svg{stroke:var(--red)}
.adm-link.status-tab.st-open svg{stroke:var(--green)}
.adm-drawer-sec{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.08em;margin:14px 0 5px;padding-inline-start:10px}
.adm-drawer-sec:first-of-type{margin-top:6px}
.adm-logout{margin-top:10px;border-top:1px solid var(--line);padding-top:16px;color:var(--red)}
.adm-logout svg{stroke:var(--red)}

.gsi-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;color:var(--muted)}
.gsi-loading .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:admspin .8s linear infinite}
@keyframes admspin{to{transform:rotate(360deg)}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:24px 0 15px;flex-wrap:wrap}
.sec-head h2{font-size:1.3rem;font-weight:800;color:var(--navy);position:relative;padding-inline-start:14px}
.sec-head h2::before{content:"";position:absolute;inset-inline-start:0;top:5px;bottom:5px;width:4px;border-radius:3px;background:var(--grad-o)}
.sec-head .tools{display:flex;gap:10px;align-items:center;font-size:.88rem;color:var(--muted)}
.sec-head select{width:auto;padding:7px 12px;font-size:.88rem}
.viewall{color:var(--orange);font-weight:700;font-size:.9rem}
.viewall:hover{color:var(--orange-d)}

/* ===== بطاقات المنتجات — أسلوب eDukan ===== */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:stretch}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.p-card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.18s;position:relative;height:100%;box-shadow:var(--shadow)}
.p-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.p-img{aspect-ratio:1;background:var(--white);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:14px}
.p-img img{width:100%;height:100%;object-fit:contain;transition:.25s}
.p-card:hover .p-img img{transform:scale(1.05)}
.p-ph{width:74%;height:74%;border-radius:14px;background:#F3F5F8;display:flex;align-items:center;justify-content:center;color:#A8B2BF}
.p-ph svg{width:44%;height:44%}
.p-badges{position:absolute;top:9px;inset-inline-start:9px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;z-index:2}
.pb{font-size:.76rem;font-weight:800;padding:4px 11px;border-radius:999px;color:#fff;letter-spacing:.02em}
.pb.off{background:var(--grad-o)}
.pb.deal{background:var(--dark)}
.pb.pop{background:var(--dark)}
.share{display:none}
.p-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.p-cat{order:1;align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--white)}
.p-name{order:2;font-size:.94rem;font-weight:800;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-desc{display:none}
.p-price{order:3;margin-top:auto;padding-top:4px;font-size:1.08rem;font-weight:800;color:var(--orange);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.p-price .old{font-size:.84rem;font-weight:600;color:var(--muted);text-decoration:line-through}
.p-buy{order:4;display:block;margin-top:9px;background:var(--grad-y);color:#1E2A42;border-radius:10px;padding:11px;font-weight:800;font-size:.88rem;letter-spacing:.03em;transition:.18s;box-shadow:var(--glow)}
.p-buy:hover{filter:brightness(1.05);transform:translateY(-1px)}


/* ===== بطاقة فيديو ===== */
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:16px}
.v-card{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:.2s}
.v-card:hover{box-shadow:var(--shadow-h)}
.v-media{aspect-ratio:16/9;background:var(--dark);position:relative;display:flex;align-items:center;justify-content:center}
.v-media video,.v-media iframe{width:100%;height:100%;border:none}
.v-open{display:flex;flex-direction:column;align-items:center;gap:10px;color:#B9C7D4;font-size:.84rem;padding:18px;width:100%;text-align:center}
.v-open .play{width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.15rem;transition:.2s}
.v-open:hover .play{transform:scale(1.1)}
.v-body{padding:13px 15px 15px}
.v-title{font-weight:700;font-size:.95rem;color:var(--navy)}
.v-note{margin-top:9px;background:#EEF1FF;border:1px solid #D5DCFF;border-inline-start:3px solid var(--orange);border-radius:6px;padding:9px 12px;font-size:.87rem;color:#2E3A66;white-space:pre-wrap}
.v-note b{color:var(--orange-d);font-size:.8rem;display:block;margin-bottom:2px}
.v-meta{font-size:.82rem;color:var(--muted);margin-top:8px}
.v-price-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}
.v-price-row .p-price{padding:0;margin:0}
.v-buy{background:var(--grad-y);color:#1E2A42;border-radius:var(--r);padding:9px 20px;font-weight:700;font-size:.89rem}
.v-buy:hover{filter:brightness(1.08)}

/* ===== تبويبات فرعية ===== */
.subtabs{display:flex;gap:0;margin:20px 0 16px;border-bottom:2px solid var(--line)}
.subtab{padding:10px 24px;font-weight:700;font-size:.94rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.subtab.active{color:var(--navy);border-color:var(--orange)}
.subview{display:none}.subview.on{display:block}

/* ===== بطاقة الحساب (مثل MAANKA) ===== */
.acc-card{display:flex;align-items:center;gap:11px;background:var(--grad-n);border-radius:14px;padding:12px 13px;margin-bottom:14px;box-shadow:var(--shadow)}
.acc-card .ic{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-card .ic svg{width:26px;height:26px}
.acc-card .in{flex:1;min-width:0}
.acc-card .in b{display:block;font-size:.88rem;color:#fff;line-height:1.35}
.acc-card .in span{display:block;font-size:.85rem;color:#9DB0C2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.acc-card .in span.set{color:#3DDC84;font-weight:700}
.acc-card button{background:var(--grad-o);color:#fff;border-radius:10px;padding:9px 18px;font-weight:800;font-size:.88rem;flex-shrink:0;box-shadow:var(--glow);transition:.18s}
.acc-card button:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* ═══ تسجيل الدخول بجوجل ═══ */
.gsi-card{max-width:420px;margin:32px auto;background:var(--white);border-radius:22px;padding:34px 26px 28px;text-align:center;box-shadow:0 8px 34px rgba(31,41,55,.1);border:1px solid var(--line)}
.gsi-icon{width:70px;height:70px;border-radius:20px;background:var(--grad-o);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 22px rgba(255,107,0,.32)}
.gsi-icon svg{width:34px;height:34px;fill:#fff}
.gsi-card h2{font-size:1.5rem;font-weight:800;color:var(--text);margin-bottom:5px}
.gsi-card .sub{font-size:.82rem;font-weight:800;color:var(--muted);letter-spacing:.14em;margin-bottom:22px}
.gsi-btn{width:100%;display:flex;align-items:center;gap:13px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:15px 16px;text-align:start;transition:.18s;position:relative;overflow:hidden;cursor:pointer}
.gsi-btn:hover{border-color:var(--orange);box-shadow:0 6px 20px rgba(31,41,55,.1);transform:translateY(-1px)}
.gsi-btn .g{width:44px;height:44px;border-radius:12px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gsi-btn .g svg{width:24px;height:24px}
.gsi-btn .tx{flex:1;min-width:0}
.gsi-btn .tx b{display:block;font-size:1rem;font-weight:800;color:var(--text);line-height:1.35}
.gsi-btn .tx span{font-size:.85rem;color:var(--muted)}
.gsi-btn .go{width:40px;height:40px;border-radius:50%;background:var(--grad-o);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gsi-btn .go svg{width:19px;height:19px;fill:#fff}
.gsi-btn::after{content:"";position:absolute;bottom:0;inset-inline:0;height:4px;background:linear-gradient(90deg,#4285F4 0 25%,#EA4335 25% 50%,#FBBC05 50% 75%,#34A853 75%)}
.gsi-note{display:flex;align-items:center;justify-content:center;gap:7px;font-size:.84rem;color:var(--muted);margin-top:16px;flex-wrap:wrap}
.gsi-note svg{width:16px;height:16px;stroke:var(--green);fill:none}
.gsi-safe{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:.82rem;font-weight:800;color:var(--muted);letter-spacing:.1em}
.gsi-safe svg{width:16px;height:16px;stroke:var(--muted);fill:none}
.gsi-alt{display:block;margin-top:16px;font-size:.88rem;color:var(--orange);font-weight:700;text-decoration:underline;cursor:pointer}

/* إكمال التسجيل */
.reg-card{max-width:420px;margin:32px auto;background:var(--white);border-radius:22px;overflow:hidden;box-shadow:0 8px 34px rgba(31,41,55,.12);border:1px solid var(--line)}
.reg-head{background:linear-gradient(135deg,#4ADE80 0%,#16A34A 100%);color:#fff;padding:30px 22px 26px;text-align:center}
.reg-head .ck{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.reg-head .ck svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2}
.reg-head h3{font-size:1.35rem;font-weight:800;line-height:1.35}
.reg-head p{font-size:.91rem;opacity:.92;margin-top:5px}
.reg-body{padding:22px}
.reg-user{display:flex;align-items:center;gap:13px;background:var(--bg);border-radius:14px;padding:13px}
.reg-user .av{width:52px;height:52px;border-radius:13px;background:#3B82F6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;flex-shrink:0;overflow:hidden}
.reg-user .av img{width:100%;height:100%;object-fit:cover}
.reg-user .in{flex:1;min-width:0}
.reg-user .in b{display:block;font-size:.98rem;font-weight:800;color:var(--text)}
.reg-user .in span{font-size:.87rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;direction:ltr}
.reg-user .ok{width:26px;height:26px;flex-shrink:0}
.reg-user .ok svg{width:100%;height:100%;stroke:var(--green);fill:none;stroke-width:2}
.reg-lbl{font-size:.83rem;font-weight:800;color:var(--muted);letter-spacing:.1em;margin:22px 0 9px}
.reg-phone{display:flex;gap:10px}
.reg-cc{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font-weight:800;color:var(--text);background:var(--white);flex-shrink:0;font-size:.95rem}
.reg-phone input{flex:1;border-radius:14px;font-size:1rem;letter-spacing:.04em}
.reg-btn{width:100%;background:var(--dark);color:#fff;border-radius:14px;padding:15px;font-weight:800;font-size:1rem;margin-top:18px;transition:.18s;min-height:52px}
.reg-btn:hover{filter:brightness(1.15)}
.reg-terms{text-align:center;font-size:.84rem;color:var(--muted);margin-top:18px}
.reg-terms b{color:var(--text)}

/* ═══ فقاعة الترحيب ═══ */
.chat-teaser{position:fixed;bottom:156px;right:16px;max-width:min(280px,calc(100vw - 90px));background:var(--white);border-radius:16px;padding:16px 18px;box-shadow:0 10px 34px rgba(31,41,55,.2);z-index:84;display:none;border:1px solid var(--line)}
.chat-teaser.on{display:block;animation:teaseIn .3s ease}
@keyframes teaseIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
.chat-teaser p{font-size:.92rem;line-height:1.7;color:var(--text);font-weight:500;cursor:pointer;margin:0}
.chat-teaser .ct-close{position:absolute;top:-12px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--white);border:1px solid var(--line);color:var(--muted);font-size:.94rem;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(31,41,55,.14);transition:.15s}
.chat-teaser .ct-close:hover{background:var(--bg);color:var(--text)}
@media(max-width:520px){ .chat-teaser{bottom:148px;right:12px;padding:14px 16px} .chat-teaser p{font-size:.92rem} }

/* ═══ المحادثة المباشرة ═══ */
.chat-fab{position:fixed;bottom:92px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--grad-o);color:#fff;display:flex;align-items:center;justify-content:center;z-index:80;box-shadow:0 6px 20px rgba(255,107,0,.45);transition:.2s;border:none;cursor:pointer}
.chat-fab:hover{transform:scale(1.08)}
.chat-fab svg{width:26px;height:26px;fill:#fff}
.chat-fab .dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:.78rem;font-weight:800;display:none;align-items:center;justify-content:center;border:2px solid var(--white);padding:0 5px}
.chat-fab .dot.on{display:flex}
.chat-win{position:fixed;bottom:92px;right:16px;width:min(350px,calc(100vw - 32px));height:min(470px,70vh);background:var(--white);border-radius:18px;box-shadow:0 18px 50px rgba(31,41,55,.28);z-index:95;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.chat-win.on{display:flex;animation:chatIn .22s ease}
@keyframes chatIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.chat-head{background:var(--grad-o);color:#fff;padding:13px 15px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-head .av{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.chat-head .av img{width:100%;height:100%;object-fit:cover}
.chat-head .in{flex:1;min-width:0}
.chat-head .in b{display:block;font-size:.94rem;line-height:1.3}
.chat-head .in span{font-size:.8rem;opacity:.9;display:flex;align-items:center;gap:5px}
.chat-head .in span i{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block}
.chat-head button{color:#fff;font-size:1.15rem;padding:3px 8px;border-radius:8px;opacity:.9}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:.9rem;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.msg.bot{background:var(--white);border:1px solid var(--line);align-self:flex-start;border-start-start-radius:4px;color:var(--text)}
.msg.me{background:var(--grad-o);color:#fff;align-self:flex-end;border-end-end-radius:4px}
.msg .tm{display:block;font-size:.76rem;opacity:.65;margin-top:3px}
.chat-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;background:var(--bg)}
.chat-chips button{background:var(--white);border:1px solid var(--orange);color:var(--orange);border-radius:999px;padding:6px 13px;font-size:.84rem;font-weight:700;transition:.15s}
.chat-chips button:hover{background:var(--orange);color:#fff}
.chat-foot{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line);background:var(--white);flex-shrink:0}
.chat-foot input{flex:1;border-radius:12px;font-size:.93rem}
.chat-foot button{background:var(--grad-o);color:#fff;border-radius:12px;padding:0 16px;font-weight:800;flex-shrink:0;min-width:48px}
.chat-foot button svg{width:19px;height:19px;fill:#fff}
@media(max-width:520px){
  .chat-win{left:12px;right:12px;width:auto;bottom:86px;height:min(440px,64vh)}
  .chat-fab{bottom:86px;right:12px;width:48px;height:48px}
}

/* ===== نموذج التواصل عبر واتساب ===== */
.wa-form{text-align:center}
.wa-form .ic{width:62px;height:62px;border-radius:18px;background:#25D366;display:flex;align-items:center;justify-content:center;margin:4px auto 12px;box-shadow:0 6px 18px rgba(37,211,102,.35)}
.wa-form .ic svg{width:34px;height:34px;fill:#fff}
.wa-form h4{font-size:1.02rem;font-weight:800;color:var(--navy);margin-bottom:6px}
.wa-form p{font-size:.84rem;color:var(--muted);line-height:1.7;margin-bottom:16px}
.wa-form .item{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:.91rem;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.wa-form .item b{color:var(--orange-d)}
.wa-form label{display:block;text-align:start;font-size:.87rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.wa-form small{display:block;text-align:start;font-size:.83rem;color:var(--muted);margin-top:6px}
.wa-send{width:100%;background:#25D366;color:#fff;border-radius:12px;padding:13px;font-weight:800;font-size:.95rem;margin-top:16px;min-height:48px}
.wa-send:hover{background:#1DB954}

/* ===== كيف يعمل الموقع ===== */
.how-sec{text-align:center;padding:34px 0 8px;margin-top:30px;border-top:1px solid var(--line)}
.how-badge{display:inline-flex;align-items:center;gap:7px;background:#EEF1FF;color:var(--orange-d);font-size:.82rem;font-weight:800;padding:7px 18px;border-radius:999px;margin-bottom:16px}
.how-badge svg{width:15px;height:15px;fill:var(--orange-d)}
.how-sec h2{font-size:1.5rem;font-weight:800;color:var(--text);line-height:1.35;margin-bottom:10px}
.how-sec h2 span{color:var(--orange)}
.how-sec p{font-size:.94rem;color:var(--muted);max-width:440px;margin:0 auto 26px;line-height:1.7}
.how-video{max-width:380px;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-h);border:1px solid var(--line);position:relative;aspect-ratio:9/16;background:var(--grad-n)}
.how-video iframe{width:100%;height:100%;border:0;display:block}
.how-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:640px;margin:0 auto}
@media(max-width:560px){.how-steps{grid-template-columns:1fr;gap:12px;text-align:start}}
.how-step{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 16px;position:relative}
@media(max-width:560px){.how-step{display:flex;align-items:center;gap:14px;padding:14px 16px}}
.how-step .n{width:38px;height:38px;border-radius:11px;background:var(--grad-o);color:#fff;font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;flex-shrink:0}
@media(max-width:560px){.how-step .n{margin:0}}
.how-step b{display:block;font-size:.92rem;font-weight:800;color:var(--text);margin-bottom:4px}
.how-step span{font-size:.85rem;color:var(--muted);line-height:1.6}

/* ===== لوحة إدخال الحساب المضمّنة ===== */
.acc-panel{display:none;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;margin:-6px 0 14px;box-shadow:var(--shadow);animation:accIn .22s ease}
.acc-panel.on{display:block}
@keyframes accIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.acc-panel label{display:block;font-size:.85rem;font-weight:700;color:var(--navy);margin-bottom:5px}
.acc-panel small{display:block;font-size:.82rem;color:var(--muted);margin-top:5px}
.acc-panel .fld{margin-bottom:11px}

/* ===== باقات الشدات — أسلوب MAANKA ===== */
.uc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;align-items:stretch}
.uc{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:.18s;display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow)}

.uc-tile{aspect-ratio:1.03;background:var(--white);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:8px}
.uc-tile svg,.uc-tile img{width:92%;height:92%;object-fit:contain}
.uc-body{padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--grad-o2)}
.uc-amt{font-size:1.05rem;font-weight:800;color:#FFFFFF;line-height:1.2;white-space:nowrap;display:flex;align-items:baseline;justify-content:center;gap:0}
.uc-amt .bn{color:#DDE3FF}
.uc-amt .pl{color:rgba(255,255,255,.85);font-weight:700;margin:0 2px}
.uc-amt small{font-size:.56em;color:rgba(255,255,255,.85);font-weight:800;margin-inline-start:4px}
.uc-price{font-size:1.08rem;font-weight:800;color:#FFFFFF;line-height:1.2;display:flex;align-items:baseline;gap:6px}
.uc-price s{font-size:.62em;color:rgba(255,255,255,.75);font-weight:600;text-decoration:line-through}
/* شارات فوق الصورة — لا تزيد ارتفاع الشريط */
.uc-tag{position:absolute;z-index:2;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:6px;line-height:1.55}
.uc-tag.bonus{top:7px;inset-inline-start:7px;background:rgba(19,41,61,.92);color:#3D5AFE}
.uc-tag.disc{top:7px;inset-inline-end:7px;background:linear-gradient(90deg,#3D5AFE,#00B589);color:#fff}
.uc-tag.hot{bottom:7px;inset-inline-start:7px;background:var(--red);color:#fff}

@media(min-width:768px){.uc-grid{grid-template-columns:repeat(4,1fr);gap:14px}}

/* ===== بطاقات الأقسام — صورة كبيرة ===== */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:start}
@media(min-width:768px){.cat-grid{grid-template-columns:repeat(4,1fr);gap:20px}}
.cat-card{background:transparent;border:none;box-shadow:none;padding:0;text-align:center;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center}
.cat-card:hover{transform:translateY(-4px)}
.cat-card .i{width:100%;aspect-ratio:1;border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--grad-n);position:relative;box-shadow:0 6px 20px rgba(31,41,55,.16);margin:0}
.cat-card:hover .i{box-shadow:0 12px 30px rgba(31,41,55,.24)}
.cat-card .i img{width:100%;height:100%;object-fit:cover}
.cat-card .i svg{width:46%;height:46%}
.cat-card b{margin-top:11px;display:block;color:var(--text);font-size:.92rem;font-weight:800;line-height:1.35}
.cat-card span{font-size:.84rem;color:var(--muted);line-height:1.5;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-card.soon{opacity:.75}
.cat-card .soonbadge{position:absolute;bottom:10px;inset-inline-start:50%;transform:translateX(-50%);background:var(--white);color:var(--orange);font-size:.78rem;font-weight:800;padding:4px 14px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:2;white-space:nowrap}
[dir="rtl"] .cat-card .soonbadge{transform:translateX(50%)}


/* ===== الدعم ===== */
.sup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:20px}
.sup-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:20px 16px;text-align:center;box-shadow:var(--shadow)}
.sup-card .i{width:46px;height:46px;border-radius:12px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:#EEF1FF;color:var(--orange-d);font-weight:800;font-size:.94rem}
.sup-card b{display:block;color:var(--navy);font-size:.92rem}
.sup-card span{font-size:.85rem;color:var(--muted)}
.sup-card a{display:inline-block;margin-top:11px;background:var(--grad-n);color:#fff;border-radius:var(--r);padding:7px 22px;font-size:.87rem;font-weight:700}
.sup-card a:hover{background:var(--grad-o)}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
.feat{background:var(--white);padding:15px 16px;display:flex;gap:12px;align-items:center}
.feat svg{width:28px;height:28px;stroke:var(--orange);flex-shrink:0;fill:none}
.feat b{font-size:.91rem;display:block}
.feat span{font-size:.84rem;color:var(--muted)}
.faq details{background:var(--white);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:0 16px;box-shadow:var(--shadow)}
.faq summary{cursor:pointer;font-weight:700;font-size:.94rem;color:var(--navy);padding:13px 0;list-style:none;position:relative;padding-inline-end:24px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;inset-inline-end:0;top:10px;color:var(--orange);font-size:1.2rem;font-weight:800}
.faq details[open] summary::after{content:"−"}
.faq p{font-size:.84rem;color:var(--muted);padding:0 0 14px}

/* ===== النشرة ===== */
.newsletter{background:var(--grad-n);border-radius:12px;padding:32px 24px;text-align:center;color:#fff;margin:36px 0 0}
.newsletter h3{font-size:1.3rem;font-weight:800}
.newsletter p{color:#B9C7D4;font-size:.93rem;margin:5px 0 16px}
.news-form{display:flex;max-width:440px;margin:0 auto;gap:8px}
.news-form button{background:var(--grad-o);color:#fff;border-radius:var(--r);padding:0 26px;font-weight:700;white-space:nowrap}
.news-form button:hover{background:var(--orange-d)}
.news-msg{margin-top:10px;font-size:.9rem;color:#7BE3A8;min-height:1.3em}

/* ===== الفوتر ===== */
footer{background:var(--grad-n);color:#B9C7D4;margin-top:44px}
.f-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr;gap:32px;padding:40px 16px 30px;max-width:1230px;margin:0 auto}
.f-grid h4{color:#fff;font-size:.95rem;font-weight:700;margin-bottom:12px}
.f-grid ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.f-grid a:hover{color:var(--orange)}
.f-about p{font-size:.9rem;max-width:36ch;margin-top:8px}
.f-social{display:flex;gap:9px;margin-top:14px}
.f-social a{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:700}
.f-social a:hover{background:var(--orange);color:#fff}
.f-pay{border-top:1px solid rgba(255,255,255,.1);padding:13px 16px;text-align:center;font-size:.87rem}
.f-pay .pill{display:inline-block;background:rgba(255,255,255,.08);border-radius:5px;padding:3px 12px;margin:2px 4px;font-size:.84rem;color:#fff}
.f-copy{border-top:1px solid rgba(255,255,255,.1);padding:13px;text-align:center;font-size:.85rem;color:#8CA0B3}
.f-copy button{text-decoration:underline;color:#8CA0B3}
.f-copy button:hover{color:var(--orange)}

/* ===== السلة ===== */
.overlay{position:fixed;inset:0;background:rgba(19,41,61,.5);opacity:0;pointer-events:none;transition:.25s;z-index:98}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;inset-inline-start:0;height:100vh;height:100dvh;width:min(390px,94vw);background:var(--white);z-index:99;transform:translateX(-102%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.18)}
[dir="rtl"] .drawer{left:0;right:auto;transform:translateX(-102%)}
[dir="ltr"] .drawer{right:0;left:auto;transform:translateX(102%)}
.drawer.open{transform:none!important}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--grad-n);color:#fff}
.d-head h3{font-size:1.02rem;font-weight:700}
.close-x{font-size:1.15rem;color:#C8D4DF;padding:4px 10px;border-radius:6px}
.close-x:hover{background:rgba(255,255,255,.1);color:#fff}
.d-items{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:38vh;flex-shrink:0}
.d-item{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px}
.d-item .th{width:44px;height:44px;border-radius:8px;background:var(--bg);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:.9rem}
.d-item .in{flex:1;min-width:0}
.d-item .in b{font-size:.88rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--navy)}
.d-item .in span{font-size:.87rem;color:var(--orange-d);font-weight:700}
.rm{color:var(--red);padding:4px 8px;font-size:.94rem}
.d-foot{border-top:1px solid var(--line);padding:13px 16px;background:#FBFCFD;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.d-foot input{margin-bottom:9px}
.t-row{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px;color:var(--navy)}
.checkout{width:100%;background:var(--grad-y);color:#1E2A42;border-radius:12px;padding:13px;font-weight:800;font-size:.92rem;box-shadow:var(--glow);transition:.18s}
.checkout:hover{filter:brightness(1.07);transform:translateY(-1px)}
.d-note{font-size:.82rem;color:var(--muted);text-align:center;margin-top:8px}

/* ===== الإدارة ===== */
.admin-strip{background:#EEF1FF;border-bottom:1px solid #D5DCFF;color:#7A5410;padding:8px 16px;display:none;align-items:center;gap:12px;font-size:.89rem}
.admin-strip.on{display:flex}
.admin-brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:18px}
.admin-brand .mk{width:48px;height:48px;border-radius:13px;background:var(--dark);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.admin-brand .mk svg{width:28px;height:28px}
.admin-brand .mk img{width:100%;height:100%;object-fit:cover}
.admin-brand .tx b{display:block;font-size:1.15rem;color:var(--navy);line-height:1.2}
.admin-brand .tx span{font-size:.8rem;color:var(--orange-d);font-weight:700;letter-spacing:.12em}


.login-box{max-width:380px;margin:56px auto;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:32px 28px;text-align:center;box-shadow:var(--shadow-h)}
.login-box h2{font-size:1.25rem;font-weight:800;color:var(--navy);margin-bottom:4px}
.login-box p{color:var(--muted);font-size:.84rem;margin-bottom:15px}
.login-box input{margin-bottom:10px;text-align:center}
.err{color:var(--red);font-size:.87rem;min-height:1.3em;margin-top:8px}
.a-btn{background:var(--grad-o);color:#fff;border-radius:12px;padding:14px 28px;font-weight:700;font-size:.95rem;min-height:48px;transition:.18s;box-shadow:var(--glow)}
.a-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.a-btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none}
.a-btn.ghost:hover{color:var(--red);border-color:var(--red);background:transparent}
.a-form{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}

/* ═══ التحليلات ═══ */
.an-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.an-kpi{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--white);transition:.15s}
.an-kpi:hover{border-color:var(--orange);box-shadow:var(--shadow)}
.an-kpi-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.an-kpi-h .bar{width:3px;height:15px;border-radius:99px;flex-shrink:0}
.an-kpi-h span{font-size:.85rem;font-weight:700;color:var(--muted)}
.an-kpi-b{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.an-kpi-b b{font-size:1.6rem;font-weight:800;letter-spacing:-.5px;line-height:1;color:var(--navy)}
.an-kpi-b small{font-size:.82rem;color:var(--muted);font-weight:500}

.an-g2{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;margin-bottom:12px}
.an-g3{display:grid;grid-template-columns:1.1fr .95fr .95fr;gap:12px;margin-bottom:12px}
.an-card{border:1px solid var(--line);border-radius:14px;background:var(--white);overflow:hidden;box-shadow:var(--shadow)}
.an-h{display:flex;align-items:center;gap:10px;padding:14px 16px}
.an-h .tx{flex:1;min-width:0}
.an-h h3{font-size:.94rem;font-weight:800;color:var(--navy)}
.an-h p{font-size:.82rem;color:var(--muted);margin-top:1px}

.an-bars-wrap{padding:0 16px 14px;position:relative}
.an-bars{width:100%;height:190px;overflow:visible}
.an-bar-r{transition:opacity .15s}
.an-bars:hover .an-bar-r{opacity:.45}
.an-bars .an-bar-r:hover,.an-bars .an-bar-r.hi{opacity:1}
.an-tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:5px 9px;border-radius:7px;font-size:.82rem;font-weight:800;white-space:nowrap;transform:translate(50%,-100%);box-shadow:0 3px 12px rgba(0,0,0,.18)}

.an-donut-wrap{display:flex;align-items:center;gap:14px;padding:0 16px 16px;flex-wrap:wrap}
.an-donut{position:relative;width:128px;height:128px;flex-shrink:0}
.an-donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.an-donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.an-donut .mid b{display:block;font-size:1.3rem;font-weight:800;color:var(--navy);letter-spacing:-.5px}
.an-donut .mid span{display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-top:1px}
.an-legend{flex:1;min-width:128px;display:flex;flex-direction:column;gap:7px}
.an-lg{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.an-lg .ln{width:3px;height:22px;border-radius:99px;flex-shrink:0}
.an-lg .tx{flex:1;min-width:0}
.an-lg .tx b{display:block;font-size:.84rem;font-weight:700;color:var(--navy)}
.an-lg .tx span{display:block;font-size:.78rem;color:var(--muted)}
.an-lg em{font-style:normal;font-size:.85rem;font-weight:800;color:var(--navy)}

.an-fn{padding:0 16px 14px}
.an-fn-i{display:flex;align-items:flex-start;gap:11px;padding:9px 0;position:relative}
.an-fn-i:not(:last-child)::before{content:"";position:absolute;inset-inline-start:15px;top:40px;bottom:-2px;width:1.5px;background:var(--line)}
.an-fn-i .ic{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;z-index:1}
.an-fn-i .ic svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.1}
.an-fn-i .tx{flex:1;min-width:0}
.an-fn-i .tx b{display:block;font-size:.85rem;font-weight:800;color:var(--navy)}
.an-fn-i .tx p{font-size:.8rem;color:var(--muted);line-height:1.45;margin:1px 0 2px}
.an-fn-i .tx small{font-size:.78rem;color:var(--muted);font-weight:600}
.an-fn-i>em{font-style:normal;font-size:.95rem;font-weight:800;color:var(--navy);flex-shrink:0}

.an-tg{padding:0 16px 16px}
.an-tg-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.an-tg-top b{font-size:2rem;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--navy)}
.an-tg-top span{font-size:.84rem;font-weight:700;color:var(--muted)}
.an-tg-bar{height:9px;border-radius:99px;background:var(--bg);overflow:hidden;margin-bottom:9px}
.an-tg-fill{height:100%;border-radius:99px;background:var(--grad-o);transition:width .8s cubic-bezier(.22,1,.36,1)}
.an-tg-foot{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;margin-bottom:12px}
.an-tg-foot span{color:var(--muted);font-weight:600}
.an-tg-foot b{font-weight:800;color:var(--navy)}
.an-tg-edit{display:flex;gap:7px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.an-tg-edit input{flex:1;margin:0;padding:8px 10px;font-size:.85rem}

.an-team{padding:0 16px 14px;display:flex;flex-direction:column;gap:2px}
.an-tm{display:flex;align-items:center;gap:10px;padding:8px 0}
.an-tm .av{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:.82rem;font-weight:800}
.an-tm .tx{flex:1;min-width:0}
.an-tm .tx b{display:block;font-size:.84rem;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-tm .tx span{display:block;font-size:.8rem;color:var(--muted)}
.an-tm .bdg{font-size:.8rem;font-weight:800;background:var(--bg);color:var(--muted);padding:4px 9px;border-radius:8px;white-space:nowrap;flex-shrink:0}

.an-tbl{width:100%;border-collapse:collapse}
.an-tbl th{text-align:start;font-size:.78rem;font-weight:800;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.an-tbl td{padding:10px 14px;font-size:.85rem;border-bottom:1px solid var(--bg);white-space:nowrap;color:var(--text)}
.an-tbl tbody tr:last-child td{border-bottom:none}
.an-tbl tbody tr{transition:background .12s}
.an-tbl tbody tr:hover{background:var(--bg)}
.an-prod{display:flex;align-items:center;gap:9px}
.an-prod .lg{width:27px;height:27px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-size:.76rem;font-weight:800;color:#fff}
.an-prod b{font-weight:700;color:var(--navy)}
.an-pct{font-weight:800}
.an-badge{display:inline-block;font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px}
.an-empty{text-align:center;color:var(--muted);font-size:.9rem;padding:38px 16px}

@media(max-width:1180px){.an-g3{grid-template-columns:1fr 1fr}.an-g3>.an-card:last-child{grid-column:1/-1}}
@media(max-width:1040px){.an-kpis{grid-template-columns:repeat(2,1fr)}.an-g2{grid-template-columns:1fr}}
@media(max-width:700px){.an-kpis{grid-template-columns:1fr}.an-g3{grid-template-columns:1fr}.an-g3>.an-card:last-child{grid-column:auto}}
.a-form h3{font-size:.94rem;font-weight:700;color:var(--navy);margin-bottom:12px}
.f-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.a-list{display:flex;flex-direction:column;gap:7px}
.a-row{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.9rem}
.a-row .mv{color:var(--muted);font-weight:700;padding:3px 7px;border-radius:6px;font-size:.82rem;line-height:1}
.a-row .mv:hover{background:var(--bg);color:var(--orange-d)}
.a-row .mv:disabled{opacity:.25;pointer-events:none}
.a-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-row .del{color:var(--red);font-weight:700;padding:3px 10px;border-radius:6px;font-size:.87rem}
.a-row .del:hover{background:#FDECEA}
.order{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 15px;margin-bottom:9px;font-size:.9rem;box-shadow:var(--shadow)}
.order b{color:var(--navy)}
.order .o-date{float:left;color:var(--muted);font-size:.84rem}
[dir="ltr"] .order .o-date{float:right}
.order .items{color:var(--muted);margin-top:3px;font-size:.87rem}
.order .st{display:inline-block;background:#EFF3F8;color:#41546B;padding:1px 12px;border-radius:4px;font-size:.82rem;font-weight:700;margin-top:6px}
.order .st.accepted{background:#EEF1FF;color:#2E45D8}
.order .st.shipping{background:#F5F2FE;color:#6D4FC7}
.order .st.delivered{background:#E7F6EE;color:var(--green)}
.order .st.rejected{background:#FDECEA;color:var(--red)}
.order .st.refunded{background:#FAF6EE;color:#8B6F3E}
.order .by{display:block;font-size:.8rem;color:var(--muted);margin-top:4px;direction:ltr;text-align:start}
.stbtns{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.stbtns button{font-size:.82rem;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--muted);background:var(--white)}
.st-select{font-size:.84rem;font-weight:700;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--white);color:var(--text)}
.st-select.st-new{border-color:var(--line);color:var(--text)}
.st-select.st-accepted{border-color:#2E45D8;color:#2E45D8;background:#EEF1FF}
.st-select.st-shipping{border-color:#6D4FC7;color:#6D4FC7;background:#F5F2FE}
.st-select.st-delivered{border-color:var(--green);color:var(--green);background:#F0FBF4}
.st-select.st-rejected{border-color:var(--red);color:var(--red);background:#FEF3F2}
.st-select.st-refunded{border-color:#8B6F3E;color:#8B6F3E;background:#FAF6EE}
.stbtns button:hover{border-color:var(--orange);color:var(--orange-d)}


/* ═══ تبويب حالة المتجر ═══ */
.store-toggle{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px}
.store-toggle .ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#E7F6EE;color:var(--green)}
.store-toggle.is-closed .ic{background:#FDECEA;color:var(--red)}
.store-toggle .ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
.store-toggle .tx{flex:1;min-width:0}
.store-toggle .tx b{display:block;font-size:.95rem;color:var(--text)}
.store-toggle .tx span{font-size:.85rem;color:var(--muted)}
.store-switch{width:52px;height:30px;border-radius:999px;background:var(--green);position:relative;flex-shrink:0;cursor:pointer;border:none;transition:.2s}
.store-switch.off{background:#D1D5DB}
.store-switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.2s}
.store-switch.off::after{inset-inline-start:25px}
.bg-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:14px 0 4px}
.bg-pick{border-radius:13px;overflow:hidden;border:2.5px solid var(--line);cursor:pointer;position:relative;aspect-ratio:3/4;transition:.15s}
.bg-pick.sel{border-color:var(--orange)}
.bg-pick.sel::after{content:"✓";position:absolute;top:6px;inset-inline-end:6px;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-size:.82rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.bg-pick .p1{width:100%;height:100%;background:radial-gradient(circle at 30% 20%,#6B7FFF 0%,transparent 45%),radial-gradient(circle at 80% 80%,#3D5AFE 0%,transparent 50%),linear-gradient(160deg,#1E2A42 0%,#0D1424 100%)}
.bg-pick .p2{width:100%;height:100%;background:#F7F8FA;display:flex;align-items:center;justify-content:center}
.bg-pick .p2::before{content:"";width:30%;height:30%;border-radius:50%;background:#EEF1FF;box-shadow:0 4px 10px rgba(255,107,0,.2)}
.bg-pick .p3{width:100%;height:100%;background:#0B111A;background-image:radial-gradient(rgba(255,255,255,.15) 1px,transparent 1px);background-size:10px 10px}
.bg-pick span{position:absolute;bottom:5px;inset-inline-start:0;inset-inline-end:0;text-align:center;font-size:.76rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.bg-pick .p2 + span{color:var(--text);text-shadow:none}

/* ===== الشريط السفلي ===== */
.bottomnav{position:fixed;bottom:0;right:0;left:0;z-index:90;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(16,24,40,.09);display:flex;justify-content:space-around;align-items:stretch;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;font-weight:700;color:var(--muted);padding:5px 10px;border-radius:10px;min-width:58px;position:relative;transition:.15s}
.bn svg{width:22px;height:22px;stroke:currentColor;fill:none}
.bn:hover{color:var(--navy)}
.bn.active{color:var(--orange)}
.bn.active::after{content:"";position:absolute;top:-7px;right:50%;transform:translateX(50%);width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--grad-o)}
.bn .bbadge{position:absolute;top:0;inset-inline-start:6px;background:var(--orange);color:#fff;font-size:.76rem;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ===== واتساب + توست ===== */
.toast{position:fixed;bottom:24px;right:50%;transform:translate(50%,80px);background:var(--dark);color:#fff;padding:11px 26px;border-radius:var(--r);font-size:.92rem;font-weight:600;z-index:130;opacity:0;transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(50%,0)}
.loading{text-align:center;color:var(--muted);padding:50px 0;grid-column:1/-1}

.brand .mark svg{width:26px;height:26px}
.brand .mark img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.slide .art svg{width:110px;height:110px;display:block}
.cat-card .i svg{width:34px;height:34px}
.uc .ic{width:64px;height:64px;margin:0 auto 6px;background:none;border-radius:0}

.p-ph svg{width:56px;height:56px}
.d-item .th{background:var(--dark);color:#fff}
.d-item .th svg{width:24px;height:24px}
.sup-card .i svg{width:100%;height:100%}
.sup-card .i img{width:100%;height:100%;object-fit:cover}
.f-social a svg{width:18px;height:18px}
.v-open .play svg{width:24px;height:24px;fill:#fff}

.cat-card.soon{opacity:.72;position:relative}
.cat-card .soonbadge{position:absolute;top:10px;inset-inline-start:10px;background:var(--orange);color:#fff;font-size:.76rem;font-weight:800;padding:3px 10px;border-radius:5px}
.soonbox{text-align:center;background:var(--white);border:1.5px dashed var(--line);border-radius:14px;padding:52px 20px;box-shadow:var(--shadow)}
.soonbox .ic{width:74px;height:74px;margin:0 auto 14px;border-radius:20px;background:#EEF1FF;display:flex;align-items:center;justify-content:center}
.soonbox .ic svg{width:38px;height:38px;stroke:var(--orange-d);fill:none}
.soonbox h3{font-size:1.35rem;font-weight:800;color:var(--navy)}
.soonbox p{color:var(--muted);font-size:.94rem;margin-top:6px}
.a-note{font-size:.84rem;color:var(--muted);margin:-4px 0 10px}
.a-sub{font-size:.87rem;font-weight:700;color:var(--orange-d);margin:14px 0 7px;border-top:1px solid var(--line);padding-top:12px}
.a-row select{width:auto;padding:5px 10px;font-size:.85rem}
.stat-pill{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:5px;margin-inline-end:6px}
.stat-pill.on{background:#E7F6EE;color:var(--green)}
.stat-pill.soon{background:#EEF1FF;color:#2E45D8}
.stat-pill.off{background:#F1F3F6;color:var(--muted)}

/* ===== إدارة الدفع ===== */
.pm-logo{width:42px;height:42px;border-radius:10px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;padding:4px}
.pm-logo img{max-width:100%;max-height:100%;object-fit:contain}
.pm-logo .fb{font-weight:800;color:var(--orange-d);font-size:1rem}
.pm-adm{display:flex;align-items:center;gap:11px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pm-adm .info{flex:1;min-width:0}
.pm-adm .info b{display:block;font-size:.91rem;color:var(--navy)}
.pm-adm .info span{font-size:.83rem;color:var(--muted);direction:ltr;display:inline-block}
.num-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.num-row input[type=radio]{width:19px;height:19px;accent-color:var(--orange);flex-shrink:0;margin:0}
.num-row input[type=text]{flex:1}
.pm-opt-logo{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;padding:3px}
.pm-opt-logo img{max-width:100%;max-height:100%;object-fit:contain}
.pm-opt-logo .fb{font-weight:800;color:var(--orange-d);font-size:.9rem}

/* ===== الهمبرغر ===== */
.burger{width:40px;height:40px;border-radius:11px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.burger:hover{border-color:var(--orange)}
.burger svg{width:21px;height:21px;stroke:var(--navy);fill:none}
.mm-ov{position:fixed;inset:0;background:rgba(19,41,61,.5);opacity:0;pointer-events:none;transition:.25s;z-index:96}
.mm-ov.open{opacity:1;pointer-events:auto}
.mmenu{position:fixed;top:0;height:100vh;height:100dvh;width:min(300px,84vw);background:var(--white);z-index:97;transition:transform .3s ease;display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 0 40px rgba(0,0,0,.25)}
[dir="rtl"] .mmenu{right:0;transform:translateX(102%)}
[dir="ltr"] .mmenu{left:0;transform:translateX(-102%)}
.mmenu.open{transform:none!important}
.mm-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--grad-n)}
.mm-head b{color:var(--white);font-size:1rem}
.mm-head button{color:#C8D4DF;font-size:1.2rem;padding:4px 10px;border-radius:8px}
.mm-body{padding:12px 16px 24px;flex:1}
.mm-link{display:flex;align-items:center;gap:11px;width:100%;padding:12px 10px;border-radius:10px;font-size:.94rem;font-weight:600;color:var(--text);text-align:start;transition:.15s}
.mm-link:hover{background:var(--bg)}
.mm-link svg{width:20px;height:20px;stroke:var(--orange);fill:none;flex-shrink:0}
.mm-sec{font-size:.82rem;font-weight:800;color:var(--muted);margin:16px 0 7px;padding-inline-start:10px;letter-spacing:.04em}
.mm-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mm-seg button{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 4px;font-size:.82rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;transition:.15s}
.mm-seg button svg{width:17px;height:17px;stroke:currentColor;fill:none}
.mm-seg button.on{border-color:var(--orange);color:var(--orange-d);background:#EEF1FF}
[data-theme="dark"] .mm-seg button.on{background:#141C33}
.trk-box{display:flex;gap:7px;margin-top:6px}
.trk-box input{flex:1}
.trk-box button{background:var(--grad-n);color:var(--white);border-radius:var(--r);padding:0 18px;font-weight:700;font-size:.88rem;white-space:nowrap}

/* ===== نافذة التأكيد ===== */
.cf-ov{position:fixed;inset:0;z-index:130;background:rgba(19,41,61,.6);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:.2s}
.cf-ov.open{opacity:1;pointer-events:auto}
.cf{background:var(--white);border-radius:18px;max-width:340px;width:100%;padding:26px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.cf .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:#EEF1FF}
[data-theme="dark"] .cf .ic{background:#141C33}
.cf .ic svg{width:27px;height:27px;stroke:var(--orange-d);fill:none}
.cf h3{font-size:1.05rem;font-weight:800;color:var(--navy);margin-bottom:6px}
.cf p{font-size:.9rem;color:var(--muted);margin-bottom:18px;line-height:1.6}
.cf-btns{display:flex;gap:9px}
.cf-btns button{flex:1;border-radius:12px;padding:12px;font-weight:700;font-size:.93rem;min-height:46px}
.cf-no{background:var(--bg);border:1px solid var(--line);color:var(--text)}
.cf-no:hover{border-color:var(--muted)}
.cf-yes{background:var(--orange);color:#fff}
.cf-yes:hover{background:var(--orange-d)}
.cf-yes.danger{background:var(--red)}

/* ===== تفاصيل الطلب ===== */
.od-ov{position:fixed;inset:0;z-index:110;background:rgba(19,41,61,.6);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:.22s}
.od-ov.open{opacity:1;pointer-events:auto}
.od{background:var(--white);border-radius:16px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.od-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--grad-n)}
.od-head b{color:var(--white);font-size:1rem}
.od-head button{color:#C8D4DF;font-size:1.15rem;padding:4px 10px;border-radius:8px}
.od-body{padding:16px 18px 20px}
.od-code{text-align:center;margin-bottom:14px}
.od-code b{display:block;font-size:1.5rem;font-weight:800;color:var(--orange-d);direction:ltr;letter-spacing:1px}
.od-code span{font-size:.84rem;color:var(--muted)}
.od-r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.od-cancel{text-align:center;font-size:.9rem;font-weight:700;padding:12px;border-radius:12px;margin-bottom:14px}
.od-cancel.rejected{background:#FDECEA;color:var(--red)}
.od-cancel.refunded{background:#FAF6EE;color:#8B6F3E}
.od-cancel small{display:block;font-weight:600;font-size:.82rem;opacity:.8;margin-top:4px}
.od-r span{color:var(--muted);font-weight:600;flex-shrink:0}
.od-r b{text-align:end;color:var(--navy);word-break:break-word}
.tl{margin-top:16px}
.tl-i{display:flex;gap:11px;align-items:flex-start;padding:8px 0}
.tl-i .dot{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:4px;flex-shrink:0;position:relative}
.tl-i.on .dot{background:var(--green)}
.tl-i.now .dot{background:var(--orange);box-shadow:0 0 0 4px rgba(247,148,29,.2)}
.tl-i .tt{font-size:.89rem;font-weight:700;color:var(--navy)}
.tl-i .tt small{display:block;color:var(--muted);font-weight:600;font-size:.82rem;margin-top:2px}
.tl-i:not(.on):not(.now) .tt{color:var(--muted)}
.od-rcpt{width:100%;border-radius:10px;margin-top:12px;border:1px solid var(--line);cursor:zoom-in}

/* ===== الوضع الاحتياطي ===== */
.fallback{display:none;margin-top:10px;background:#EEF1FF;border:1px solid #D5DCFF;border-radius:11px;padding:12px 13px}
.fallback.on{display:block}
[data-theme="dark"] .fallback{background:#141C33;border-color:#4A3A1C}
.fallback .fh{display:flex;align-items:center;gap:7px;font-size:.84rem;font-weight:700;color:#7A5410;margin-bottom:9px;line-height:1.5}
[data-theme="dark"] .fallback .fh{color:#F0DDBC}
.fallback label{display:block;font-size:.84rem;font-weight:700;color:var(--navy);margin-bottom:5px}
.fallback small{display:block;font-size:.8rem;color:var(--muted);margin-top:5px}

/* ===== نتيجة التحقق ===== */
.vrf-card{display:none;align-items:center;gap:11px;background:#E7F6EE;border:1px solid #BFE6D2;border-radius:11px;padding:11px 13px;margin-top:9px}
.vrf-card.on{display:flex}
[data-theme="dark"] .vrf-card{background:#12301F;border-color:#1E4A32}
.vrf-card .av{width:38px;height:38px;border-radius:10px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0}
.vrf-card .in{flex:1;min-width:0}
.vrf-card .in small{display:block;font-size:.8rem;color:#0d6b4f;font-weight:700}
[data-theme="dark"] .vrf-card .in small{color:#5FD99A}
.vrf-card .in b{display:block;font-size:.95rem;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrf-card .ok{color:var(--green);font-size:1.1rem;font-weight:800;flex-shrink:0}

/* ===== التحقق من الآيدي ===== */
.vrf-row{display:flex;gap:8px;align-items:stretch}
.vrf-row input{flex:1}
.vrf-btn{background:var(--grad-n);color:#fff;border-radius:var(--r);padding:0 18px;font-weight:700;font-size:.88rem;white-space:nowrap;flex-shrink:0}
.vrf-btn:hover{background:var(--grad-o)}
.vrf-btn:disabled{opacity:.6;cursor:wait}
.vrf-res{margin-top:7px;font-size:.87rem;font-weight:700;min-height:1.2em;display:flex;align-items:center;gap:6px}
.vrf-res.ok{color:var(--green)}
.vrf-res.bad{color:var(--red)}
.vrf-res.wait{color:var(--muted)}

/* ===== بطاقة إدخال الحساب ===== */
.idcard{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.idcard .ih{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.idcard .ih .n{width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800;flex-shrink:0}
.idcard .ih b{font-size:.94rem;color:var(--navy)}
.idcard .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.idcard small{display:block;font-size:.82rem;color:var(--muted);margin-top:6px}
.idcard .safe{background:#E7F6EE;border:1px solid #BFE6D2;color:#0d6b4f;border-radius:7px;padding:6px 9px;font-size:.8rem;font-weight:700;margin-top:8px;line-height:1.5}
[data-theme="dark"] .idcard .safe{background:#12301F;border-color:#1E4A32;color:#5FD99A}

@media(max-width:520px){ .idcard .row{grid-template-columns:1fr} }

/* ===== زر العودة ===== */
.backbtn{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.89rem;font-weight:700;color:var(--navy);margin:16px 0 4px;box-shadow:var(--shadow);transition:.15s}
.backbtn:hover{border-color:var(--orange);color:var(--orange-d)}
.backbtn svg{width:16px;height:16px;stroke:currentColor;fill:none}
[dir="ltr"] .backbtn svg{transform:scaleX(-1)}

/* ===== خطوات الطلب ===== */
.steps{display:flex;align-items:center;gap:6px;padding:11px 16px;background:#FBFCFD;border-bottom:1px solid var(--line)}
.stp{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted)}
.stp i{width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--white);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.8rem;font-weight:800;flex-shrink:0}
.stp.on{color:var(--navy)}
.stp.on i{background:var(--orange);color:#fff}
.stp.done i{background:var(--green);color:#fff}
.stp-line{flex:1;height:2px;background:var(--line);border-radius:2px}
.sum-line{background:#FBFCFD;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.sum-line b{color:var(--navy)}
.back-link{display:block;text-align:center;font-size:.87rem;color:var(--muted);margin-top:10px;text-decoration:underline;cursor:pointer}
.back-link:hover{color:var(--orange-d)}

/* ===== حقول الطلب ===== */
.fld{margin-bottom:9px}
.fld label{display:block;font-size:.84rem;font-weight:700;color:var(--navy);margin-bottom:4px}
.fld small{display:block;font-size:.8rem;color:var(--muted);margin-top:3px}
.fld .safe{background:#E7F6EE;border:1px solid #BFE6D2;color:#0d6b4f;border-radius:7px;padding:6px 9px;font-size:.8rem;font-weight:700;margin-top:5px;line-height:1.5}
.grp{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px;background:#FBFCFD}
.grp .gt{font-size:.84rem;font-weight:800;color:var(--orange-d);margin-bottom:8px}
.recv-line{background:#fff;border:1px solid #D5DCFF;border-radius:8px;padding:8px 11px;margin-top:9px;font-size:.87rem;color:#2E3A66;display:flex;justify-content:space-between;align-items:center;gap:8px}
.recv-line b{color:var(--navy);font-size:.95rem;direction:ltr;letter-spacing:.4px}

/* ===== إثبات التحويل ===== */
.rcpt-lbl{font-size:.85rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.rcpt-lbl b{color:var(--red)}
.checkout:disabled{opacity:.5;cursor:not-allowed}
.checkout:disabled:hover{background:var(--orange)}
.upl-btn.need{border-color:var(--red);background:#FDECEA}
.upl-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--white);border:1.5px dashed var(--line2);border-radius:10px;padding:12px;font-weight:700;font-size:.9rem;color:var(--navy);cursor:pointer;transition:.15s}
.upl-btn:hover{border-color:var(--orange);color:var(--orange-d)}
.upl-btn svg{width:18px;height:18px;stroke:currentColor;fill:none}
.rcpt-prev{display:flex;align-items:center;gap:10px;margin-top:9px;background:#E7F6EE;border:1px solid #BFE6D2;border-radius:10px;padding:9px}
.rcpt-prev img{width:52px;height:52px;border-radius:9px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in}
.rcpt-prev span{flex:1;font-size:.87rem;font-weight:700;color:var(--green)}
.rcpt-prev button{color:var(--red);font-weight:700;padding:4px 10px;border-radius:7px;font-size:.94rem}
.rcpt-err{color:var(--red);font-size:.85rem;font-weight:700;margin-top:6px;min-height:1em}
.ord-rcpt{display:block;width:100%;max-width:210px;border-radius:10px;margin-top:8px;cursor:zoom-in;border:1px solid var(--line);box-shadow:var(--shadow)}

/* ===== الدفع ===== */
.pay-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.pay-opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.15s;background:var(--white)}
.pay-opt:hover{border-color:var(--orange)}
.pay-opt.sel{border-color:var(--orange);background:#EEF1FF}
.pay-opt .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative}
.pay-opt.sel .r{border-color:var(--orange)}
.pay-opt.sel .r::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--orange)}
.pay-opt b{font-size:.93rem;color:var(--navy);display:block}
.pay-opt span{font-size:.83rem;color:var(--muted)}
.pay-box{background:#EEF1FF;border:1px solid #D5DCFF;border-radius:10px;padding:14px;text-align:center;margin-bottom:10px}
.pay-box .lbl{font-size:.84rem;color:#7A5410;margin-bottom:6px}
.pay-code{font-size:1.25rem;font-weight:800;color:var(--navy);direction:ltr;letter-spacing:.5px;word-break:break-all}
.pay-actions{display:flex;gap:8px;margin-top:11px}
.pay-actions a,.pay-actions button{flex:1;border-radius:var(--r);padding:10px;font-weight:700;font-size:.89rem;text-align:center}
.pay-dial{background:var(--green);color:#fff}
.pay-copy{background:var(--white);border:1.5px solid var(--line);color:var(--navy)}
.pay-amt{font-size:.87rem;color:#7A5410;margin-top:8px}
.back-link{display:block;text-align:center;font-size:.87rem;color:var(--muted);margin-top:9px;text-decoration:underline}

/* ===== استجابة ===== */

/* ═══════════ تجاوب شامل لكل الأجهزة ═══════════ */
html,body{overflow-x:hidden;max-width:100vw}

}

}

  .container{padding:0 18px}
}

@media(max-width:1024px){
  .f-grid{grid-template-columns:1.4fr 1fr 1fr;gap:26px}

  .grid.sm{grid-template-columns:repeat(4,1fr)}

let DB = null, ORDERS = [], MSGS = [];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmt = n => '$' + Number(n).toLocaleString('en');
const fin = p => (p && p.disc > 0) ? +(Number(p.price) * (1 - p.disc/100)).toFixed(2) : Number(p.price);
const esc = s => String(s??'').replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

async function loadAll(){
  try{ const l = await window.storage.get('marjan-lang', false); if(['en','ar','so'].includes(l.value)) LANG = l.value; }catch(e){}
  try{ const th = await window.storage.get('marjan-theme', false); if(['light','dark','auto'].includes(th.value)) THEME = th.value; }catch(e){}
  await loadVrfCache();
  await loadAcc();
  await loadChats();
  applyTheme();
  applyLang();
  try{ const r = await window.storage.get(DB_KEY, true); DB = JSON.parse(r.value); }
  catch(e){ DB = JSON.parse(JSON.stringify(seed)); await saveDB(); }
  ['pay','elec','games','gitems','faq'].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k] = JSON.parse(JSON.stringify(seed[k])); });
  DB.sections = Object.assign({}, seed.sections, DB.sections||{});
  if(!DB.txt || typeof DB.txt !== 'object') DB.txt = {};
  DB.set = Object.assign({}, seed.set, DB.set||{});
  DB.builtin = DB.builtin || {};
  ['efoot','pubg','tiktok','efacc'].forEach(k=>{ DB.builtin[k] = DB.builtin[k] || {}; });
  DB.pages = DB.pages || {};
  ['privacy','terms','refund'].forEach(k=>{ DB.pages[k] = Object.assign({}, seed.pages[k], DB.pages[k]||{}); });
  try{ const o = await window.storage.get(ORDERS_KEY, true); ORDERS = JSON.parse(o.value); }
  catch(e){ ORDERS = []; }
  try{ const m = await window.storage.get(MSGS_KEY, true); MSGS = JSON.parse(m.value); }
  catch(e){ MSGS = []; }
  try{ const u = await window.storage.get(USERS_KEY, true); USERS = JSON.parse(u.value); }
  catch(e){ USERS = []; }
  try{ const s = await window.storage.get('marjan-session', false); CUR = USERS.find(x=>x.id===s.value) || null; }
  catch(e){ CUR = null; }
  applyLang();
  renderAll();
  applyAccountUI();
}
async function saveDB(){
  try{ await window.storage.set(DB_KEY, JSON.stringify(DB), true); }
  catch(e){ showToast(t('saveFail')); }
}
async function saveOrders(){
  try{ await window.storage.set(ORDERS_KEY, JSON.stringify(ORDERS), true); }
  catch(e){ showToast(t('sendFail')); }
}

/* ═══ التنقل ═══ */
function go(v, arg){
  const guard = {pubg:'pubg', efoot:'icons', tiktok:'tiktok', efacc:'accounts'};
  if(DB && guard[v] && DB.sections[guard[v]] !== 'on'){ openSoon(v); return; }
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  document.getElementById('pg-'+v).classList.add('on');
  if(v==='game') renderGamePage(arg);
  const map = {efoot:'games', pubg:'games', game:'games', soon:'games', tiktok:'accounts', efacc:'accounts'};
  const hv = map[v] || v;
  document.querySelectorAll('.bottomnav .bn').forEach(b=>b.classList.toggle('active', b.dataset.v===hv));
  window.scrollTo({top:0,behavior:'smooth'});
}
function subGo(s){
  document.querySelectorAll('#pg-efoot .subview').forEach(x=>x.classList.remove('on'));
  document.getElementById('s-'+s).classList.add('on');
  document.querySelectorAll('#pg-efoot .subtab').forEach(b=>b.classList.toggle('active', b.dataset.s===s));
}
function aGo(a){
  if(a==='analytics') setTimeout(renderAnalytics, 0);
  if(a==='txt') setTimeout(renderTxtList, 0);
  if(a==='pol') setTimeout(loadPolicy, 0);
  if(a==='sections') setTimeout(loadBuiltin, 0);
  if(a==='chat') setTimeout(()=>{ loadChats().then(renderChatAdmin); }, 0);
  document.querySelectorAll('#adminWrap .subview').forEach(x=>x.classList.remove('on'));
  document.getElementById('a-'+a).classList.add('on');
  document.querySelectorAll('.adm-link[data-a]').forEach(b=>b.classList.toggle('active', b.dataset.a===a));
  document.querySelector('.adm-drawer-body').scrollTop = 0;
}
function toggleAdminDrawer(open){
  const d = document.getElementById('admDrawer'), ov = document.getElementById('admDrawerOv');
  const willOpen = (open === undefined) ? !d.classList.contains('on') : open;
  d.classList.toggle('on', willOpen);
  ov.classList.toggle('on', willOpen);
}
function adminNav(a){
  aGo(a);
  toggleAdminDrawer(false);
  document.querySelector('#pg-admin .container').scrollIntoView({behavior:'smooth', block:'start'});
}

  const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy" title="${title}"></iframe>`;
  return `<a class="v-open" href="${u}" target="_blank" rel="noopener"><div class="play">${SVG.playtri}</div><span>${u.includes('tiktok')?t('watchTk'):t('watch')}</span></a>`;
}
function imgOrPh(img, name){
  if(img && /^https?:\/\//i.test(img)) return `<img src="${img}" alt="${esc(name)}" loading="lazy">`;
  return `<div class="p-ph">${SVG.i.box}</div>`;
}

function pmNums(m){ const a=(m.numbers&&m.numbers.length)?m.numbers.slice(0,3):[m.merchant||'']; while(a.length<3)a.push(''); return a; }
function pmActive(m){ const a=pmNums(m); let i=m.active|0; if(!a[i]){ for(let j=0;j<3;j++){ if(a[j]){ i=j; break; } } } return a[i]||m.merchant||''; }
function pmCode(m, total){
  const num = pmActive(m).replace(/^0/,'');
  if(m.prefix && num) return '*'+m.prefix+'*'+num+'*'+String(+Number(total).toFixed(2)).replace('.','*')+'#';
  if(m.ussd && m.merchant) return m.ussd.replace('{merchant}', m.merchant).replace('{amount}', total);
  return '';
}

function productCard(p, type, catLabel, buyLabel, direct){
  const badges = [];
  const price = fin(p);
  const wasOld = p.old && p.old > price ? p.old : (p.disc > 0 ? p.price : null);
  if(p.disc > 0) badges.push(`<span class="pb off">-${p.disc}%</span>`);
  else if(p.old && p.old > price) badges.push(`<span class="pb off">${discBadge(Math.round((1-price/p.old)*100))}</span>`);
  if(p.rating) badges.push(`<span class="pb deal">${p.rating} OVR</span>`);
  const fn = direct ? 'directBuy' : 'addToCart';
  return `<article class="p-card">
    <div class="p-img">${imgOrPh(p.img, p.name)}
      ${badges.length?`<div class="p-badges">${badges.join('')}</div>`:''}
    </div>
    <div class="p-body">
      <span class="p-cat">${catLabel}</span>
      <h3 class="p-name">${esc(p.name)}</h3>
      <div class="p-price">${fmt(price)}${wasOld?`<span class="old">${fmt(wasOld)}</span>`:''}</div>
      <button class="p-buy" onclick="${fn}('${type}','${p.id}')">${buyLabel}</button>
    </div>
  </article>`;
}

  if(type==='pubg') return {type,id, name:`${p.amount} UC — PUBG`, price:fin(p)};
  if(type==='accounts') return {type,id, name:p.title, price:fin(p)};
  return {type,id, name:p.name, price:fin(p)};
}
function addToCart(type,id){

function updateCart(){
  const w = document.getElementById('cartItems');

let PAYSEL = null;

let RCPT='';
function compressImg(dataUrl, cb, maxW){
  const img=new Image();
  img.onload=function(){
    const mw=maxW||760; let w=img.width, h=img.height;
    if(w>mw){ h=Math.round(h*mw/w); w=mw; }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    let out;
    try{ out=cv.toDataURL('image/webp',0.82); }catch(e){}
    if(!out || out.indexOf('data:image/webp')!==0){ try{ out=cv.toDataURL('image/jpeg',0.82); }catch(e2){ out=dataUrl; } }
    cb(out);
  };
  img.onerror=function(){ cb(dataUrl); };
  img.src=dataUrl;
}
/* ═══ رفع صور المنتجات من الجوال — دالة مشتركة لكل النماذج ═══ */
function wireImgUpload(fileId, urlId, prevWrapId, prevImgId){
  const fileEl = document.getElementById(fileId);
  const urlEl = document.getElementById(urlId);
  if(!fileEl || !urlEl) return;
  const showPrev = (src) => {
    const wrap = prevWrapId && document.getElementById(prevWrapId);
    const img = prevImgId && document.getElementById(prevImgId);
    if(!wrap || !img) return;
    if(src){ img.src = src; wrap.style.display = 'flex'; }
    else { wrap.style.display = 'none'; }
  };
  fileEl.addEventListener('change', function(){
    const f = this.files && this.files[0]; this.value = '';
    if(!f) return;
    const rd = new FileReader();
    rd.onload = () => compressImg(rd.result, out=>{ urlEl.value = out; showPrev(out); }, 700);
    rd.readAsDataURL(f);
  });
  urlEl.addEventListener('input', function(){
    const v = this.value.trim();
    showPrev(v && v.indexOf('http')===0 ? v : (v.indexOf('data:')===0 ? v : ''));
  });
  // معاينة أولية عند فتح النموذج بوضع تعديل
  if(urlEl.value) showPrev(urlEl.value);
}
function clearImgField(urlId, prevWrapId){
  const el = document.getElementById(urlId); if(el) el.value = '';
  const wrap = document.getElementById(prevWrapId); if(wrap) wrap.style.display = 'none';
}

function setStep(n){
  const dr = document.getElementById('drawer'); if(dr) dr.scrollTop = 0;
  const it0 = document.getElementById('cartItems'); if(it0) it0.scrollTop = 0;
  const ft = document.querySelector('.d-foot'); if(ft) ft.scrollTop = 0;
  document.getElementById('step1').style.display = n===1?'block':'none';
  document.getElementById('stepInfo').style.display = n===2?'block':'none';
  document.getElementById('step2').style.display = n===3?'block':'none';
  document.getElementById('stepWa').style.display = n===4?'block':'none';
  document.getElementById('cartItems').style.display = (n===1 && !BUYNOW)?'flex':'none';
  const steps = document.querySelector('.steps');
  if(steps) steps.style.display = BUYNOW ? 'none' : 'flex';
  const back = document.querySelector('#stepInfo .back-link');
  if(back) back.style.display = BUYNOW ? 'none' : 'block';
  document.getElementById('drawerTitle').textContent =
    BUYNOW ? (BUYNOW.name || t('stPay')) : (n===1 ? t('cartTitle') : (n===2 ? t('stInfo') : t('stPay')));
  [1,2,3].forEach(i=>{
    const el = document.getElementById('stp'+i);
    el.classList.toggle('on', i===n);
    el.classList.toggle('done', i<n);
  });
}

function directBuy(type, id){
  const it = findItem(type, id); if(!it) return;
  // لازم بيانات الحساب أولاً
  if(type === 'pubg' && (!ACC.pid || !ACC.ign)){ showToast(t('setAccFirst')); toggleAccPanel('pubg', true); return; }
  if(type === 'icons' && !ACC.gEmail){ showToast(t('setAccFirst')); toggleAccPanel('icons', true); return; }
  BUYNOW = Object.assign({}, it, type==='pubg' ? {pid:ACC.pid, ign:ACC.ign} : (type==='icons' ? {gEmail:ACC.gEmail, gPass:ACC.gPass} : {}));
  if(type === 'icons'){
    document.getElementById('waItem').textContent = it.name;
    document.getElementById('waPrice').textContent = fmt(it.price);
    document.getElementById('waPhone').value = ACC.wa || '';
    toggleCart(true, true);
    setStep(4);
    return;
  }
  clearRcpt(); document.getElementById('rcptErr').textContent='';
  document.getElementById('paySum').textContent = it.name;
  document.getElementById('payTotal').textContent = fmt(it.price);

  PAYSEL = methods.length ? methods[0].id : null;
  toggleCart(true, true);
  setStep(3);
  renderPay();
