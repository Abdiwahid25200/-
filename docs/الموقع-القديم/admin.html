async function checkout(method){
  const items = buyItems();
  if(!items.length){ showToast(t('emptyCartT')); return; }
  const L = LANG==='ar';
  const payName = method ? (L?method.nameAr:method.nameEn) : '—';
  const total = buyTotal();
  const B = BUYNOW;
  let base;
  if(B){
    base = { name:'', contact:'', addr:'', pid:B.pid||'', ign:B.ign||'', gEmail:B.gEmail||'', gPass:B.gPass||'' };
  } else {
    const name = gv('buyerName'), contact = gv('buyerContact'), addr = gv('buyerAddr');
    if(!name || !contact || !addr){ showToast(t('fillNC')); return; }
    if(name.split(/\s+/).filter(Boolean).length < 3){ showToast(t('badName')); return; }
    if(contact.replace(/[^0-9]/g,'').length < 9){ showToast(t('badPhone')); return; }
    if(addr.trim().length < 3){ showToast(t('badAddr')); return; }
    base = { name, contact, addr, pid:'', ign:'', gEmail:'', gPass:'' };
  }
  ORDERS.unshift(Object.assign({
    id:uid(), ts:Date.now(), code:'M-'+Date.now().toString().slice(-6),
    kind: BUYNOW ? 'digital' : 'physical',
    items: items.map(i=>i.name), total,
    status:'new', pay:payName, rcpt:RCPT||'', userId: CUR ? CUR.id : null,
    date:new Date().toLocaleString(LANG==='ar'?'ar':'en-GB')
  }, base));
  await saveOrders();
  if(!B){ cart.length = 0; updateCart(); clr('buyerAddr'); }
  BUYNOW = null;
  toggleCart(false); setStep(1); clearRcpt();
  showToast(t('orderOk') + ' — ' + ORDERS[0].code);
  renderOrders(); renderMyOrders();
  sendMail(DB.set.keyOrders, `${t('mailOrderSub')} ${ORDERS[0].code} — ${DB.set.brand}`, orderBody(ORDERS[0]), ORDERS[0].contact||'');
}

/* ═══ الثيم (يومي / ليلي / تلقائي) ═══ */
let THEME = 'auto';
function resolveTheme(){
  if(THEME === 'auto') return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  return THEME;
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolveTheme());
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.th===THEME));
}
async function setTheme(v){
  THEME = v; applyTheme();
  try{ await window.storage.set('marjan-theme', v, false); }catch(e){}
}
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const h = ()=>{ if(THEME==='auto') applyTheme(); };
  if(mq.addEventListener) mq.addEventListener('change', h); else if(mq.addListener) mq.addListener(h);
}

function openOrder(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const st = o.status || 'new';
  const cancelled = (st==='rejected' || st==='refunded');
  const step = st==='delivered' ? 3 : ((st==='accepted' || st==='shipping') ? 2 : 1);
  const tl = [
    {k:'tlNew',  d:o.date,   n:1},
    {k:'tlProc', d:o.procAt, n:2},
    {k:'tlDone', d:o.doneAt, n:3},
  ].map(x=>`
    <div class="tl-i ${x.n < step ? 'on' : (x.n===step ? 'now' : '')}">
      <span class="dot"></span>
      <span class="tt">${t(x.k)}<small>${x.d ? esc(x.d) : '—'}</small></span>
    </div>`).join('');

function toggleManualAuth(){

function jwtPayload(tok){
  try{
    const b = tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }catch(e){ return null; }
}
function loadGsi(){
  return new Promise((res, rej)=>{
    if(window.google && google.accounts && google.accounts.id) return res();
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client';
    sc.async = true; sc.defer = true;
    sc.onload = ()=>res(); sc.onerror = ()=>rej(new Error('load'));
    document.head.appendChild(sc);
  });
}
async function googleSignIn(){
  const cid = (DB.set.gClient||'').trim();
  const err = document.getElementById('authErr');
  if(!cid){ err.textContent = t('gsiNoCfg'); toggleManualAuth(); return; }
  err.textContent = '';
  try{
    await loadGsi();
    google.accounts.id.initialize({ client_id: cid, callback: onGoogleCred, auto_select: true });
    google.accounts.id.prompt(n=>{
      if(n.isNotDisplayed && n.isNotDisplayed()) err.textContent = t('gsiFail');
    });
  }catch(e){ err.textContent = t('gsiFail'); }
}
async function onGoogleCred(resp){
  const p = jwtPayload(resp && resp.credential);
  if(!p || !p.email){ document.getElementById('authErr').textContent = t('gsiFail'); return; }
  await loadUsers();
  const found = USERS.find(u => u.gid === p.sub || u.email === p.email);

async function sha256(s){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

  if(st==='shipping' && !o.shipAt) o.shipAt = now;
  if(st==='delivered' && !o.doneAt) o.doneAt = now;
  if(st==='rejected' && !o.rejAt) o.rejAt = now;
  if(st==='refunded' && !o.refundAt) o.refundAt = now;
  const by = currentAdminEmail();
  o.statusBy = by; o.statusAt = now;
  o.history = o.history || [];
  o.history.push({ st, by, at: now });
  // قبول طلب حساب eFootball يحذفه تلقائياً من المتجر — حساب فريد، ما يصح يُباع مرتين

const OTP_URL = 'https://REPLACE-WITH-YOUR-WORKER.workers.dev'; // ⚠️ بدّله برابط Worker الحقيقي بعد النشر
let OTP_PENDING_USER = null;

function showOtpScreen(){
  document.getElementById('authLoading').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('otpWrap').style.display = 'block';
  document.getElementById('otpCode').value = '';
  document.getElementById('otpErr').textContent = '';
  setTimeout(()=>document.getElementById('otpCode').focus(), 50);
}
async function requestOtp(user){
  OTP_PENDING_USER = user;
  showOtpScreen();
  try{
    const r = await fetch(OTP_URL + '/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: user.email })
    });
    const d = await r.json();
    const sub = document.getElementById('otpSub');
    if(d.ok){ sub.textContent = t('otpSub').replace('{hint}', d.hint || ''); }
    else { document.getElementById('otpErr').textContent = t('otpSendFail'); }
  }catch(e){ document.getElementById('otpErr').textContent = t('otpSendFail'); }
}
async function resendOtpCode(){
  if(!OTP_PENDING_USER) return;
  showToast(t('otpResent'));
  await requestOtp(OTP_PENDING_USER);
}
async function verifyOtpCode(){
  if(!OTP_PENDING_USER) return;
  const code = gv('otpCode');
  const err = document.getElementById('otpErr');
  if(!code || code.length !== 6){ err.textContent = t('otpInvalid'); return; }
  const btn = document.getElementById('otpVerifyBtn');
  btn.disabled = true;
  try{
    const r = await fetch(OTP_URL + '/verify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: OTP_PENDING_USER.email, code })
    });
    const d = await r.json();
    if(d.ok){
      sessionStorage.setItem('otpVerified', '1');
      const u = OTP_PENDING_USER; OTP_PENDING_USER = null;
      showAdminPanel(u);
    } else { err.textContent = t('otpInvalid'); }
  }catch(e){ err.textContent = t('otpSendFail'); }
  btn.disabled = false;
}

window.__onAdminAuthChange = function(ok, user){
  if(!DB){ // ننتظر تحميل البيانات أولاً قبل إظهار أي شاشة
    const wait = setInterval(()=>{
      if(DB){ clearInterval(wait); handleAdminAuth(ok, user); }
    }, 120);
    return;
  }
  handleAdminAuth(ok, user);
};
function handleAdminAuth(ok, user){
  if(!ok){ sessionStorage.removeItem('otpVerified'); showAdminLogin(); return; }
  // رمز التحقق مطلوب مرة وحدة لكل جلسة متصفح — لا يُطلب بكل تحديث للصفحة
  if(sessionStorage.getItem('otpVerified') === '1'){ showAdminPanel(user); return; }
  requestOtp(user);
}

/* ═══ المحادثة المباشرة ═══ */
const CHATS_KEY = 'marjan-chats';
let CHATS = [];          // كل المحادثات (مشترك)
let MYCHAT = null;       // معرّف محادثة الزائر
let CHAT_OPEN = false, CHAT_TIMER = null, LAST_SEEN = 0;

async function loadChats(){
  try{ const r = await window.storage.get(CHATS_KEY, true); CHATS = JSON.parse(r.value) || []; }catch(e){ CHATS = []; }
  try{ const m = await window.storage.get('marjan-mychat', false); MYCHAT = m.value; }catch(e){ MYCHAT = null; }
}
async function saveChats(){
  try{ await window.storage.set(CHATS_KEY, JSON.stringify(CHATS.slice(0,120)), true); }catch(e){}
}
function myChat(){ return CHATS.find(c => c.id === MYCHAT) || null; }

function chatTime(ts){
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function renderChat(){
  const body = document.getElementById('chatBody'); if(!body) return;
  const c = myChat();
  const msgs = c ? c.msgs : [{from:'bot', text:t('chatWelcome'), ts:Date.now()}];
  body.innerHTML = msgs.map(m=>
    `<div class="msg ${m.from==='user'?'me':'bot'}">${esc(m.text)}<span class="tm">${chatTime(m.ts)}</span></div>`).join('');
  body.scrollTop = body.scrollHeight;
  // اقتراحات سريعة
  const chips = document.getElementById('chatChips');
  if(chips) chips.innerHTML = (!c || c.msgs.length < 3)
    ? ['chatQ1','chatQ2','chatQ3','chatQ4'].map(k=>`<button onclick="quickChat('${k}')">${t(k)}</button>`).join('')
    : '';
}
function showTeaser(){
  if(CHAT_OPEN) return;
  try{ if(sessionStorage.getItem('marjan-teaser')) return; }catch(e){}
  const el = document.getElementById('chatTeaser');
  if(el && (!myChat() || myChat().msgs.length < 2)) el.classList.add('on');
}
function closeTeaser(e){
  if(e) e.stopPropagation();
  const el = document.getElementById('chatTeaser');
  if(el) el.classList.remove('on');
  try{ sessionStorage.setItem('marjan-teaser','1'); }catch(err){}
}
function openFromTeaser(){ closeTeaser(); toggleChat(true); }

function toggleChat(open){
  if(open !== false) closeTeaser();
  CHAT_OPEN = (open === undefined) ? !CHAT_OPEN : open;
  document.getElementById('chatWin').classList.toggle('on', CHAT_OPEN);
  if(CHAT_OPEN){
    const c = myChat(); if(c){ LAST_SEEN = c.msgs.length; c.unread = 0; saveChats(); }
    updateChatDot();
    renderChat();
    if(!CHAT_TIMER) CHAT_TIMER = setInterval(pollChat, 5000);
  }
}
function updateChatDot(){
  const c = myChat();
  const n = c ? c.msgs.filter((m,i)=> m.from==='admin' && i >= LAST_SEEN).length : 0;
  const dot = document.getElementById('chatDot');
  if(dot){ dot.textContent = n; dot.classList.toggle('on', n > 0 && !CHAT_OPEN); }
}
async function pollChat(){
  const before = myChat() ? myChat().msgs.length : 0;
  await loadChats();
  const after = myChat() ? myChat().msgs.length : 0;
  if(after !== before){ if(CHAT_OPEN){ LAST_SEEN = after; renderChat(); } updateChatDot(); }
  if(typeof renderChatAdmin === 'function') renderChatAdmin();
}
function quickChat(k){
  const q = t(k);
  document.getElementById('chatInput').value = q;
  sendChat(botAnswer(k));
}
function botAnswer(k){
  const map = { chatQ1:'chatA1', chatQ2:'chatA2', chatQ3:'chatA3', chatQ4:'chatA4' };
  return map[k] ? t(map[k]) : null;
}
async function sendChat(auto){
  const el = document.getElementById('chatInput');
  const txt = el.value.trim();
  if(!txt) return;
  el.value = '';
  await loadChats();
  let c = myChat();
  if(!c){
    c = { id: uid(), name: (CUR && CUR.name) || '', contact: (CUR && CUR.contact) || ACC.wa || '',
          msgs: [{from:'bot', text: t('chatWelcome'), ts: Date.now()}], ts: Date.now(), unread: 0 };
    CHATS.unshift(c);
    MYCHAT = c.id;
    try{ await window.storage.set('marjan-mychat', MYCHAT, false); }catch(e){}
  }
  c.msgs.push({ from:'user', text: txt, ts: Date.now() });
  c.ts = Date.now(); c.unread = (c.unread||0) + 1;
  if(auto) c.msgs.push({ from:'bot', text: auto, ts: Date.now() + 1 });
  else if(c.msgs.filter(m=>m.from==='user').length === 1)
    c.msgs.push({ from:'bot', text: t('chatAuto'), ts: Date.now() + 1 });
  LAST_SEEN = c.msgs.length;
  await saveChats();
  renderChat();
  if(typeof renderChatAdmin === 'function') renderChatAdmin();
}

/* ═══ المحادثة — جانب الإدارة ═══ */
let ADM_CHAT = null;
function renderChatAdmin(){
  const list = document.getElementById('chatAdmList'); if(!list) return;
  const L = LANG==='ar';
  const un = CHATS.reduce((n,c)=>n + (c.unread||0), 0);
  const badge = document.getElementById('chatAdmCount');
  if(badge) badge.textContent = un ? `(${un})` : '';
  list.innerHTML = CHATS.length ? CHATS.slice().sort((a,b)=>b.ts-a.ts).map(c=>{
    const last = c.msgs[c.msgs.length-1] || {};
    const lastAdmin = [...c.msgs].reverse().find(m=>m.from==='admin' && m.by);
    const open = ADM_CHAT === c.id;
    return `<div class="order" style="cursor:pointer" onclick="openAdmChat('${c.id}')">
      <b>${esc(c.name || c.contact || t('chatGuest'))}</b>${c.contact?` — ${esc(c.contact)}`:''}
      ${c.unread?`<span class="st" style="background:#FEE2E2;color:#B91C1C;margin-inline-start:6px">${c.unread}</span>`:''}
      <span class="o-date">${new Date(c.ts).toLocaleString(L?'ar':'en-GB')}</span>
      <div class="items">${esc((last.text||'').slice(0,70))}</div>
      ${lastAdmin?`<span class="by">${t('repliedBy')}: ${esc(lastAdmin.by)}</span>`:''}
      ${open?`<div style="margin-top:10px" onclick="event.stopPropagation()">
        <div style="max-height:220px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px">
          ${c.msgs.map(m=>`<div class="msg ${m.from==='user'?'bot':'me'}" style="max-width:88%;font-size:.8rem">${esc(m.text)}<span class="tm">${chatTime(m.ts)}${m.by?' · '+esc(m.by):''}</span></div>`).join('')}
        </div>
        <div style="display:flex;gap:7px;margin-top:9px">
          <input id="admChatInput" placeholder="${t('chatReplyPh')}" onkeydown="if(event.key==='Enter')sendAdmChat('${c.id}')">
          <button class="a-btn" style="padding:9px 18px" onclick="sendAdmChat('${c.id}')">${t('chatSend')}</button>
        </div>
      </div>`:''}
    </div>`;
  }).join('') : `<div class="empty">${t('chatNone')}</div>`;
}
function openAdmChat(id){
  ADM_CHAT = (ADM_CHAT === id) ? null : id;
  const c = CHATS.find(x=>x.id===id);
  if(c && ADM_CHAT){ c.unread = 0; saveChats(); }
  renderChatAdmin();
}
async function sendAdmChat(id){
  const el = document.getElementById('admChatInput'); if(!el) return;
  const txt = el.value.trim(); if(!txt) return;
  el.value = '';
  await loadChats();
  const c = CHATS.find(x=>x.id===id); if(!c) return;
  c.msgs.push({ from:'admin', text: txt, ts: Date.now(), by: currentAdminEmail() });
  c.ts = Date.now(); c.unread = 0;
  await saveChats();
  renderChatAdmin();
  if(MYCHAT === id) renderChat();
}

/* ═══ التحقق من آيدي اللعبة + ذاكرة ساعة ═══ */
const VRF_TTL = 60 * 60 * 1000;          // ساعة واحدة
let VRF_CACHE = {};                       // { "554743890": {name:"ntC4", ts:1234} }
let LAST_PID = null;                      // آخر آيدي استعمله الزبون

async function loadVrfCache(){
  try{
    const r = await window.storage.get('marjan-idcache', false);
    const o = JSON.parse(r.value);
    const now = Date.now();
    VRF_CACHE = {};
    Object.keys(o.c||{}).forEach(k=>{ if(now - o.c[k].ts < VRF_TTL) VRF_CACHE[k] = o.c[k]; });
    if(o.last && now - o.last.ts < VRF_TTL) LAST_PID = o.last;
  }catch(e){ VRF_CACHE = {}; LAST_PID = null; }
}
async function saveVrfCache(){
  try{ await window.storage.set('marjan-idcache', JSON.stringify({c:VRF_CACHE, last:LAST_PID}), false); }catch(e){}
}
function cachedName(pid){
  const c = VRF_CACHE[pid];
  return (c && Date.now() - c.ts < VRF_TTL) ? c.name : null;
}
function showVrf(cls, txt){
  const res = document.getElementById('vrfRes');
  res.className = 'vrf-res ' + cls;
  res.textContent = txt;
}
function showFallback(on){
  const f = document.getElementById('vrfFallback');
  if(!f) return;
  f.classList.toggle('on', !!on);

async function verifyPid(silent){
  const url = (DB.set.idApi||'').trim();
  const pid = gv('iPid').replace(/\D/g,'');
  const btn = document.getElementById('iVrfBtn');
  if(pid.length < 5){ if(!silent) showVrf('bad','✕ ' + t('vrfBadId')); return; }

  // ① من الذاكرة أولاً — بدون استهلاك الـ API
  const hit = cachedName(pid);
  if(hit){
    showPlayer(hit);
    autoSaveAcc('pubg', pid, hit);
    return;
  }
  if(silent) return;

  if(!url){ showVrf('wait', t('vrfManual')); showFallback(true); return; }
  btn.disabled = true;
  showVrf('wait', '⏳ ' + t('vrfWait'));
  try{
    const r = await fetch(url + (url.includes('?')?'&':'?') + 'id=' + pid, {cache:'no-store'});
    const d = await r.json();
    const name = d.name || (d.data && d.data.username) || '';
    const good = (d.ok === true) || (d.status === true && name);
    if(good && name){
      showPlayer(name);
      VRF_CACHE[pid] = { name, ts: Date.now() };
      LAST_PID = { pid, name, ts: Date.now() };
      saveVrfCache();
      autoSaveAcc('pubg', pid, name);
    } else if(d.error === 'upstream'){
      showVrf('wait', t('vrfManual')); showFallback(true);
    } else {
      showPlayer(''); showFallback(false);
      showVrf('bad', '✕ ' + t('vrfNotFound'));
    }
  }catch(e){
    showVrf('wait', t('vrfManual')); showFallback(true);
  }
  btn.disabled = false;
}

/* يحدّد فئة المنتج من اسمه بمطابقته مع قوائم المتجر */
function anCategory(name){
  const s = String(name||'').toLowerCase();
  if(DB.pubg   && DB.pubg.some(p => s.includes(String(p.amount)) && (s.includes('uc')||s.includes('شدة')||s.includes('شدات')))) return 'pubg';
  if(/\buc\b|شدة|شدات|pubg|ببجي/.test(s)) return 'pubg';
  if(DB.icons  && DB.icons.some(p => p.name && s.includes(String(p.name).toLowerCase()))) return 'icons';
  if(/efootball|كوينز|coins|icon/.test(s)) return 'icons';
  if(DB.tiktok && DB.tiktok.some(p => p.name && s.includes(String(p.name).toLowerCase()))) return 'tiktok';
  if(/tiktok|تيك توك|متابع|إعجاب/.test(s)) return 'tiktok';
  if(DB.accounts && DB.accounts.some(p => p.title && s.includes(String(p.title).toLowerCase()))) return 'accounts';
  if(DB.elec   && DB.elec.some(p => p.name && s.includes(String(p.name).toLowerCase()))) return 'elec';
  return 'elec';
}

const AN_CATS = {
  pubg:    {c:'#F7941D', k:'anCatPubg'},
  icons:   {c:'#2563EB', k:'anCatIcons'},
  tiktok:  {c:'#111111', k:'anCatTiktok'},
  accounts:{c:'#16A34A', k:'anCatAccounts'},
  elec:    {c:'#7C3AED', k:'anCatElec'}
};

function renderAnalytics(){
  const O = Array.isArray(ORDERS) ? ORDERS : [];
  const L = LANG==='ar';

  /* ── KPI ── */
  const done   = O.filter(o=>o.status===AN_DONE);
  const active = O.filter(o=>AN_ACTIVE.includes(o.status||'new'));
  const rate   = O.length ? (done.length / O.length * 100) : 0;
  const revenue= done.reduce((a,o)=>a + (+o.total||0), 0);

  document.getElementById('anKpis').innerHTML = [
    {c:'#16A34A', t:t('anKpiDone'),   v:done.length,          d:t('anKpiDoneSub')},
    {c:'#2563EB', t:t('anKpiActive'), v:active.length,        d:t('anKpiActiveSub')},
    {c:'#F7941D', t:t('anKpiRate'),   v:rate.toFixed(1)+'%',  d:t('anKpiRateSub')},
    {c:'#7C3AED', t:t('anKpiRevenue'),v:anMoney(revenue),     d:t('anKpiRevenueSub')}
  ].map(k=>`<article class="an-kpi">
    <div class="an-kpi-h"><span class="bar" style="background:${k.c}"></span><span>${esc(k.t)}</span></div>
    <div class="an-kpi-b"><b>${esc(String(k.v))}</b><small>${esc(k.d)}</small></div>
  </article>`).join('');

  /* ── اتجاه الإيرادات: آخر 6 شهور ── */
  const now = new Date(), months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ y:d.getFullYear(), m:d.getMonth(), v:0,
      label:d.toLocaleDateString(L?'ar':'en-GB',{month:'short'}) });
  }
  done.forEach(o=>{
    const ts = anOrderTime(o); if(!ts) return;
    const d = new Date(ts);
    const slot = months.find(x=>x.y===d.getFullYear() && x.m===d.getMonth());
    if(slot) slot.v += (+o.total||0);
  });
  anDrawBars(months);

  /* ── توزيع الطلبات حسب الفئة ── */
  const catCount = {};
  O.forEach(o=>(o.items||[]).forEach(it=>{
    const c = anCategory(it);
    catCount[c] = (catCount[c]||0) + 1;
  }));
  const totalItems = Object.values(catCount).reduce((a,b)=>a+b,0);
  const cats = Object.keys(AN_CATS)
    .map(k=>({ k, v:catCount[k]||0, c:AN_CATS[k].c, n:t(AN_CATS[k].k) }))
    .filter(x=>x.v>0)
    .sort((a,b)=>b.v-a.v);
  anDrawDonut(cats, totalItems);

  /* ── مسار البيع ── */
  const paid = O.filter(o=>!['rejected'].includes(o.status));
  const fn = [
    {t:t('anFn1'), d:t('anFn1d'), v:O.length,       c:'#94A3B8', i:'M6 8h12l-1 12.2A2 2 0 0 1 15 22H9a2 2 0 0 1-2-1.8zM9 8V6a3 3 0 0 1 6 0v2'},
    {t:t('anFn2'), d:t('anFn2d'), v:paid.length,    c:'#2563EB', i:'M3 6h18v12H3zM3 10h18M7 15h4'},
    {t:t('anFn3'), d:t('anFn3d'), v:O.filter(o=>['accepted','shipping','delivered'].includes(o.status)).length, c:'#F7941D', i:'M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z'},
    {t:t('anFn4'), d:t('anFn4d'), v:done.length,    c:'#16A34A', i:'m5 13 4 4L19 7'}
  ];
  const base = O.length || 1;
  document.getElementById('anFunnel').innerHTML = fn.map(f=>`<div class="an-fn-i">
    <span class="ic" style="background:${f.c}"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${f.i}"/></svg></span>
    <span class="tx"><b>${esc(f.t)}</b><p>${esc(f.d)}</p><small>${(f.v/base*100).toFixed(0)}%</small></span>
    <em>${f.v}</em></div>`).join('');

  /* ── هدف الشهر ── */
  const goal = +((DB.set && DB.set.revGoal) || 0);
  const thisMonth = done.filter(o=>{
    const ts = anOrderTime(o); if(!ts) return false;
    const d = new Date(ts);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).reduce((a,o)=>a+(+o.total||0),0);
  const pct = goal>0 ? Math.min(100, thisMonth/goal*100) : 0;
  document.getElementById('anTgPct').textContent  = pct.toFixed(1)+'%';
  document.getElementById('anTgLeft').textContent = goal>0
    ? anMoney(Math.max(0, goal-thisMonth)) + ' ' + t('anLeft')
    : t('anNoGoal');
  document.getElementById('anTgFill').style.width = pct+'%';
  document.getElementById('anTgGoal').textContent = goal>0 ? anMoney(goal) : '—';
  const gi = document.getElementById('anGoalInput');
  if(gi && document.activeElement!==gi) gi.value = goal || '';

  /* ── أداء المشرفين ── */
  const byAdmin = {};
  O.forEach(o=>{ if(o.statusBy) byAdmin[o.statusBy] = (byAdmin[o.statusBy]||0)+1; });
  const team = Object.entries(byAdmin).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const palette = ['#F7941D','#2563EB','#7C3AED','#16A34A','#DC2626','#0891B2'];
  document.getElementById('anTeam').innerHTML = team.length
    ? team.map(([email,n],i)=>`<div class="an-tm">
        <span class="av" style="background:${palette[i%palette.length]}">${esc(email.slice(0,2).toUpperCase())}</span>
        <span class="tx"><b>${esc(email)}</b><span>${t('anAdmin')}</span></span>
        <span class="bdg">${n} ${t('anOrdersUnit')}</span></div>`).join('')
    : `<div class="an-empty">${t('anNoTeam')}</div>`;

  /* ── أفضل المنتجات ── */
  const prod = {};
  O.forEach(o=>(o.items||[]).forEach(it=>{
    const key = String(it);
    if(!prod[key]) prod[key] = {n:key, o:0, w:0, rev:0, cat:anCategory(key)};
    prod[key].o++;
    if(o.status===AN_DONE){
      prod[key].w++;
      prod[key].rev += (+o.total||0) / ((o.items||[]).length||1);
    }
  }));
  const rows = Object.values(prod).sort((a,b)=>b.o-a.o).slice(0,12);
  const ab = {pubg:'UC', icons:'eF', tiktok:'TT', accounts:'AC', elec:'EL'};
  document.getElementById('anRows').innerHTML = rows.length
    ? rows.map(p=>{
        const r = p.o ? (p.w/p.o*100) : 0;
        const rc = r>=85 ? '#16A34A' : r>=70 ? '#D97706' : '#DC2626';
        const st = r>=85 ? {t:t('anStGood'),c:'#16A34A',b:'#E8F7EE'}
                 : r>=70 ? {t:t('anStOk'),  c:'#D97706',b:'#FEF3E2'}
                 :         {t:t('anStLow'), c:'#DC2626',b:'#FDECEC'};
        return `<tr>
          <td><span class="an-prod"><span class="lg" style="background:${AN_CATS[p.cat].c}">${ab[p.cat]}</span><b>${esc(p.n)}</b></span></td>
          <td>${String(p.o).padStart(2,'0')}</td>
          <td>${String(p.w).padStart(2,'0')}</td>
          <td class="an-pct" style="color:${rc}">${r.toFixed(1)}%</td>
          <td>${anMoney(p.rev)}</td>
          <td><span class="an-badge" style="color:${st.c};background:${st.b}">${st.t}</span></td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="6"><div class="an-empty">${t('anNoData')}</div></td></tr>`;
}

function anDrawBars(months){
  const el = document.getElementById('anBars'); if(!el) return;
  const W=640,H=190,PB=26,PT=10, iH=H-PB-PT;
  const max = Math.max(...months.map(m=>m.v), 1) * 1.15;
  const bw = 54, gap = (W - months.length*bw) / (months.length+1);
  const y = v => PT + iH - (v/max)*iH;

  const goal = +((DB.set && DB.set.revGoal) || 0);
  const grid = [0,.25,.5,.75,1].map(tt=>{
    const yy = PT+iH-tt*iH;
    return `<line x1="46" y1="${yy}" x2="${W}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>
      <text x="40" y="${yy+3.5}" fill="var(--muted)" font-size="9.5" font-weight="700" text-anchor="end">${fmt(max*tt).replace(/\.\d+/,'')}</text>`;
  }).join('');

  const best = months.reduce((a,b,i)=> b.v > months[a].v ? i : a, 0);
  const bars = months.map((d,i)=>{
    const x = gap + i*(bw+gap) + 20, yy = y(d.v), h = Math.max(2, PT+iH-yy);
    const hi = i===best && d.v>0;
    return `<g class="an-bar-r ${hi?'hi':''}" data-i="${i}">
      <rect x="${x}" y="${yy}" width="${bw}" height="${h}" rx="7" fill="${hi?'var(--orange)':'#E7E9EE'}"/>
      <text x="${x+bw/2}" y="${H-8}" fill="${hi?'var(--navy)':'var(--muted)'}" font-size="10" font-weight="${hi?800:600}" text-anchor="middle">${esc(d.label)}</text>
      <rect x="${x}" y="${PT}" width="${bw}" height="${iH}" fill="transparent"/></g>`;
  }).join('');

  let goalLine = '';
  if(goal>0 && goal<max){
    const gy = y(goal);
    goalLine = `<line x1="46" y1="${gy}" x2="${W}" y2="${gy}" stroke="var(--navy)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".5"/>
      <rect x="${W-118}" y="${gy-19}" width="114" height="17" rx="5" fill="var(--navy)"/>
      <text x="${W-61}" y="${gy-7}" fill="#fff" font-size="9.5" font-weight="800" text-anchor="middle">${t('anGoalLine')}: ${fmt(goal).replace(/\.\d+/,'')}</text>`;
  }
  el.innerHTML = grid + goalLine + bars;

  const tip = document.getElementById('anTip');
  const show = i => {
    const d = months[i];
    const x = gap + i*(bw+gap) + 20 + bw/2, yy = y(d.v);
    const box = el.getBoundingClientRect();
    tip.style.display = 'block';
    tip.style.insetInlineEnd = ((W-x)/W*box.width)+'px';
    tip.style.top = (yy/H*box.height - 8)+'px';
    tip.textContent = anMoney(d.v);
  };
  if(months[best].v>0) show(best); else tip.style.display='none';
  el.querySelectorAll('.an-bar-r').forEach(g=>{
    g.addEventListener('mouseenter',()=>show(+g.dataset.i));
    g.addEventListener('mouseleave',()=>{ if(months[best].v>0) show(best); });
  });
}

function anDrawDonut(cats, total){
  const el = document.getElementById('anDonut'); if(!el) return;
  const R=40, C=2*Math.PI*R;
  if(!cats.length){
    el.innerHTML = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--line)" stroke-width="13"/>`;
    document.getElementById('anTotal').textContent = '0';
    document.getElementById('anLegend').innerHTML = `<div class="an-empty">${t('anNoData')}</div>`;
    return;
  }
  let off = 0;
  el.innerHTML = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--line)" stroke-width="13"/>` +
    cats.map(c=>{
      const len = C * (c.v/total);
      const seg = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${c.c}" stroke-width="13"
        stroke-dasharray="${Math.max(0,len-1.5)} ${C-len+1.5}" stroke-dashoffset="${-off}" stroke-linecap="round"/>`;
      off += len; return seg;
    }).join('');
  document.getElementById('anTotal').textContent = total.toLocaleString();
  document.getElementById('anLegend').innerHTML = cats.map(c=>`<div class="an-lg">
    <span class="ln" style="background:${c.c}"></span>
    <span class="tx"><b>${esc(c.n)}</b><span>${(c.v/total*100).toFixed(0)}% ${t('anOfOrders')}</span></span>
    <em>${c.v}</em></div>`).join('');
}

async function saveAnalyticsGoal(){
  const v = +gv('anGoalInput') || 0;
  DB.set.revGoal = v;
  await saveDB();
  renderAnalytics();
  showToast(t('anGoalSaved'));
}

      <span class="stat-pill ${m.on===false?'off':'on'}">${m.on===false?t('stOff'):t('stOn')}</span>
      ${mv('pay',m.id,i,DB.pay.length)}

      <button class="del" style="color:var(--navy)" onclick="togglePay('${m.id}')">${m.on===false?t('stOn'):t('stOff')}</button>
      <button class="del" onclick="delPay('${m.id}')">${t('del')}</button>

  document.getElementById('aElecList').innerHTML = DB.elec.map((x,i)=>row('elec',x,`${x.name} — ${fmt(x.price)}`,'editElec',i,DB.elec.length)).join('') || none;

  const L = LANG==='ar';

  fillSiteForm();
  const pb=document.getElementById('pmSaveBtn'); if(pb) pb.textContent = PM_EDIT ? t('pmSave') : t('pmAdd');
